<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>My plugin</title>
</head>
<body>
<h1 id="title"></h1>
<p id="hint"></p>
<p>Slot: <code id="slot"></code>, locale: <code id="locale"></code></p>
<button id="toast" type="button">Show toast</button>
<!-- The frame CSP allows scripts from 'self' only: no inline scripts. tuliprox
     serves the bridge next to the plugin's own ui files at ui/_sdk/bridge.js (the
     name ui/_sdk/ is reserved); a page in a subfolder uses ../_sdk/bridge.js. -->
<script src="_sdk/bridge.js"></script>
<script src="menu.js"></script>
</body>
</html>
