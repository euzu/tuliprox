[package]
name = "sports-enricher"
version = "1.0.0"
edition = "2021"
publish = false
description = "tuliprox example plugin: regroups sport channels, orders them by fixtures, adds logos, synthetic EPG and VOD metadata"

# A plugin is its own workspace: it targets wasm32-wasip2 and is not a member of
# the tuliprox workspace.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
# Keep the dependency name: the SDK macros expand to ::tuliprox_plugin_sdk.
tuliprox-plugin-sdk = { path = "../../plugin-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
