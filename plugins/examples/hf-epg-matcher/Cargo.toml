[package]
name = "hf-epg-matcher"
version = "0.1.0"
edition = "2021"
rust-version = "1.95.0"
publish = false
description = "Example tuliprox plugin: matches misnamed playlist channels to guide channels with a HuggingFace sentence-similarity model"

# Not a member of the tuliprox workspace: it targets wasm32-wasip2 and is built
# by bin/package-plugin.sh, never committed as a binary.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
tuliprox-plugin-sdk = { path = "../../plugin-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
