id: matrix-notifier
name: Matrix Notifier
version: 0.1.0
api_version: 1
category: notifier
author: tuliprox
description: >
  Delivers tuliprox notifications to a Matrix room through the client-server
  API. Routing, quiet hours, suppression and retries come from the host's
  messaging outbox; this plugin only speaks Matrix.
capabilities:
  notifications: true
  network: true
  storage: true
hooks:
  - notifications.send
  - events.on-event
events:
  - playlist.update
  - user.connection.changed
  - stream.probe.failed
ui:
  # The channel config (and its routing) lives on the Web UI messaging page, stored
  # under settings.ext.messaging. The plugin has no standalone settings form.
  config_extensions:
    - section: messaging
      schema:
        type: object
        title: Matrix Notifier
        required:
        - room_id
        - access_token
        properties:
          homeserver:
            type: string
            title: Homeserver
            description: Base URL of the Matrix homeserver (client-server API), without a trailing path.
            default: http://127.0.0.1:18972
          room_id:
            type: string
            title: Room id
            description: 'Internal room id, for example !abcdef:example.org (not the #alias).'
          access_token:
            type: string
            title: Access token
            description: 'Access token of the bot user that is a member of the room. Write-only: it is masked
              when read back and has no default. Use ${env:VAR} to keep it out of the config file.'
            writeOnly: true
          min_severity:
            type: string
            title: Minimum severity
            description: Notifications below this severity are acknowledged without being sent. The host-side
              routing.min_severity below is applied first.
            enum:
            - info
            - warn
            - error
            default: info
          routing:
            type: object
            title: Routing (applied by tuliprox, not by the plugin)
            description: Per-channel routing of the messaging outbox, the same block a built-in channel takes.
              Every field is optional; an empty block inherits the global notify_on.
            additionalProperties: false
            properties:
              notify_on:
                type: array
                title: notify_on override
                description: Event id globs that replace the global notify_on for this channel (for example playlist.update.*).
                items:
                  type: string
              min_severity:
                type: string
                title: Minimum severity (routing)
                description: Host-side severity floor, judged on the event's registry severity before the plugin
                  is called.
                enum:
                - info
                - warn
                - error
                - critical
              quiet_hours:
                type: string
                title: Quiet hours
                description: HH:MM-HH:MM local time. Notifications inside the window are deferred, never dropped.
              max_per_hour:
                type: integer
                title: Max per hour
                description: 'Circuit breaker: after this many notifications in an hour the channel sends one
                  suppression notice and goes quiet.'
                minimum: 1
              dedup_window_secs:
                type: integer
                title: Dedup window (seconds)
                description: Suppress a repeated dedup key for this many seconds.
                minimum: 1
