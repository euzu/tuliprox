[package]
name = "matrix-notifier"
version = "0.1.0"
edition = "2021"
publish = false
description = "Example tuliprox plugin: deliver notifications to a Matrix room (notification provider, schema-only UI)"

# Not a member of the tuliprox workspace: it targets wasm32-wasip2 and is built
# by `bin/package-plugin.sh plugins/examples/matrix-notifier`. Official plugin
# packages are published as GitHub Releases by .github/workflows/plugins-release.yml.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
tuliprox-plugin-sdk = { path = "../../plugin-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
