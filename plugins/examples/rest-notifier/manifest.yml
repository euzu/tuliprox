id: rest-notifier
name: REST Notifier
version: 1.0.0
api_version: 1
category: notifier
author: tuliprox
description: >
  Delivers tuliprox notifications to any HTTP endpoint (a webhook): the event as
  JSON, or its plain-text body, with your own headers and an optional HMAC
  signature the receiver can verify. Routing, quiet hours, suppression and
  retries are the host's; this plugin builds the request and speaks HTTP.
capabilities:
  notifications: true
  network: true
hooks:
  - notifications.send
ui:
  locales: [en, ru, es, ar]   # ui/locales/<lang>.json; en is the fallback
  # The channel config (and its routing) lives on the Web UI messaging page, stored
  # under settings.ext.messaging. The plugin has no standalone settings form.
  config_extensions:
    - section: messaging
      schema:
        type: object
        title: settings.title
        required:
        - url
        properties:
          url:
            type: string
            title: settings.url.title
            description: settings.url.description
          method:
            type: string
            title: settings.method.title
            description: settings.method.description
            enum:
            - POST
            - PUT
            - PATCH
            default: POST
          body:
            type: string
            title: settings.body.title
            description: settings.body.description
            enum:
            - event
            - text
            default: event
          headers:
            type: array
            title: settings.headers.title
            description: settings.headers.description
            items:
              type: string
          secret_headers:
            type: array
            title: settings.secret_headers.title
            description: settings.secret_headers.description
            items:
              type: string
              writeOnly: true
          signing_secret:
            type: string
            title: settings.signing_secret.title
            description: settings.signing_secret.description
            writeOnly: true
          routing:
            type: object
            title: settings.routing.title
            description: settings.routing.description
            additionalProperties: false
            properties:
              notify_on:
                type: array
                title: settings.routing.notify_on.title
                description: settings.routing.notify_on.description
                items:
                  type: string
              min_severity:
                type: string
                title: settings.routing.min_severity.title
                description: settings.routing.min_severity.description
                enum:
                - info
                - warn
                - error
                - critical
              quiet_hours:
                type: string
                title: settings.routing.quiet_hours.title
                description: settings.routing.quiet_hours.description
              max_per_hour:
                type: integer
                title: settings.routing.max_per_hour.title
                description: settings.routing.max_per_hour.description
                minimum: 1
              dedup_window_secs:
                type: integer
                title: settings.routing.dedup_window_secs.title
                description: settings.routing.dedup_window_secs.description
                minimum: 1
