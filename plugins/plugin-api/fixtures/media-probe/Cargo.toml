[package]
name = "plugin-fixture-media-probe"
version = "0.0.0"
edition = "2021"
publish = false
description = "Fixture plugin: media provider for W-A1 tests"

# Not a member of the tuliprox workspace: targets wasm32-wasip2
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json = "1"
wit-bindgen = "0.63.0"

[profile.release]
opt-level = "s"
lto = true
strip = true
