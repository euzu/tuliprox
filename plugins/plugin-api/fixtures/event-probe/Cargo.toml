[package]
name = "plugin-fixture-event-probe"
version = "0.0.0"
edition = "2021"
publish = false
description = "W6a fixture plugin: the on-event hook, logging each event it is handed; one wasm, one manifest per subscription"

# Not a member of the tuliprox workspace: it targets wasm32-wasip2 and is built
# by bin/build_plugin_fixture.sh, never committed as a binary.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.63.0"

[profile.release]
opt-level = "s"
lto = true
strip = true
