[package]
name = "plugin-fixture-settings-migrate-probe"
version = "0.0.0"
edition = "2021"
publish = false
description = "W8 fixture plugin: settings schema version 2 with a v1 -> v2 `settings.migrate` (rename, default, secret move)"

# Not a member of the tuliprox workspace: it targets wasm32-wasip2 and is built
# by bin/build_plugin_fixture.sh, never committed as a binary.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
# Keep the dependency name: the SDK macros expand to ::tuliprox_plugin_sdk.
tuliprox-plugin-sdk = { path = "../../../plugin-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
