# The ui-demo component with one rpc method that never returns, under a 1 s
# deadline, for the isolation tests.
id: rpc-spin
name: UI demo (attack target, spinning rpc method)
version: 0.1.0
api_version: 1
hooks:
  - rpc.call
ui:
  rpc_exports:
    - name: spin
      kind: read
      description: Never returns.
resources:
  max_memory_mb: 32
  max_exec_ms: 1000
  max_instances: 4
  fail_mode: continue
