[package]
name = "plugin-fixture-ui-demo"
version = "0.0.0"
edition = "2021"
publish = false
description = "W6b demo plugin: rpc exports, a config section, extension and tab, sandboxed frames in all nine UI slots, en + es locales"

# Not a member of the tuliprox workspace: it targets wasm32-wasip2 and is built
# by bin/build_plugin_fixture.sh, never committed as a binary.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json = "1"
wit-bindgen = "0.63.0"

[profile.release]
opt-level = "s"
lto = true
strip = true
