# The registry rejects a component whose exports are not all used by a hook,
# so the one manifest lists a hook for each of them. `stream_headers` is what
# `stream.inject-headers` needs; `storage` backs the `calls` metric counter.
id: edge-probe
name: Edge probe (upstream headers + dashboard metrics)
version: 0.1.0
api_version: 1
capabilities:
  stream_headers: true
  storage: true
hooks:
  - stream.inject-headers
  - metrics.collect
resources:
  max_memory_mb: 32
  max_exec_ms: 5000
  max_instances: 4
  fail_mode: continue
