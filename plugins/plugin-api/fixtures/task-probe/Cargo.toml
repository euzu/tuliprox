[package]
name = "plugin-fixture-task-probe"
version = "0.0.0"
edition = "2021"
publish = false
description = "W6a fixture plugin: scheduled tasks `ok` (KV counter), `fail` (err) and `slow` (busy ~3 s)"

# Not a member of the tuliprox workspace: it targets wasm32-wasip2 and is built
# by bin/build_plugin_fixture.sh, never committed as a binary.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.63.0"

[profile.release]
opt-level = "s"
lto = true
strip = true
