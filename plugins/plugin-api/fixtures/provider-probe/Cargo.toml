[package]
name = "plugin-fixture-provider-probe"
version = "0.0.0"
edition = "2021"
publish = false
description = "W6a fixture plugin: input provider (N deterministic channels, no EPG) and a text output generator (header, one `name|group|url` line per channel, trailer)"

# Not a member of the tuliprox workspace: it targets wasm32-wasip2 and is built
# by bin/build_plugin_fixture.sh, never committed as a binary.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json = "1"
wit-bindgen = "0.63.0"

[profile.release]
opt-level = "s"
lto = true
strip = true
