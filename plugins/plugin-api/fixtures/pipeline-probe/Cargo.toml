[package]
name = "plugin-fixture-pipeline-probe"
version = "0.0.0"
edition = "2021"
publish = false
description = "W5 fixture plugin: exercises the pipeline hooks (on-playlist-loaded, stage hooks, after-sort, sort-key, assign-chno, resolve-duplicates, merge-groups); one wasm, one manifest per scenario"

# Not a member of the tuliprox workspace: it targets wasm32-wasip2 and is built
# by bin/build_plugin_fixture.sh, never committed as a binary.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json = "1"
wit-bindgen = "0.63.0"

[profile.release]
opt-level = "s"
lto = true
strip = true
