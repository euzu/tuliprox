id: telegram-notifier
name: Telegram Notifier
version: 1.0.0
api_version: 1
category: notifier
author: tuliprox
description: >
  Delivers tuliprox notifications to Telegram chats, groups, topics and channels
  through a bot, as formatted or plain text. Routing, quiet hours, suppression and
  retries are the host's; this plugin formats the message, splits a long one, and
  remembers which chats already have it so a retry never repeats a delivery.
capabilities:
  notifications: true
  network: true
  storage: true
hooks:
  - notifications.send
ui:
  locales: [en, ru, es, ar]   # ui/locales/<lang>.json; en is the fallback
  config_section:
    schema: config-schema.json
