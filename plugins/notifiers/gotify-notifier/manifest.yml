id: gotify-notifier
name: Gotify Notifier
version: 1.0.0
api_version: 1
author: tuliprox
description: >
  Delivers tuliprox notifications to a Gotify server as push messages, as plain
  text or as markdown. Routing, quiet hours, suppression and retries are the
  host's; this plugin formats the message and speaks to Gotify.
capabilities:
  notifications: true
  network: true
hooks:
  - notifications.send
ui:
  locales: [en, ru, es, ar]   # ui/locales/<lang>.json; en is the fallback
  config_section:
    schema: config-schema.json
