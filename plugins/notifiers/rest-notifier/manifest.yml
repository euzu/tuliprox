id: rest-notifier
name: REST Notifier
version: 1.0.0
api_version: 1
author: tuliprox
description: >
  Delivers tuliprox notifications to any HTTP endpoint (a webhook): the event as
  JSON, or its plain-text body, with your own headers and an optional HMAC
  signature the receiver can verify. Routing, quiet hours, suppression and
  retries are the host's; this plugin builds the request and speaks HTTP.
capabilities:
  notifications: true
  network: true
hooks:
  - notifications.send
ui:
  locales: [en, ru, es, ar]   # ui/locales/<lang>.json; en is the fallback
  config_section:
    schema: config-schema.json
