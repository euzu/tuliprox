id: command-notifier
name: Command Notifier
version: 1.0.0
api_version: 1
category: notifier
author: tuliprox
description: >
  Runs a local program for each tuliprox notification, with the event as JSON on its
  standard input. For anything that has no notifier plugin of its own: a script that
  sends mail, writes a log, drives home automation. Needs the process capability,
  which the admin approves knowingly: the program runs as the user tuliprox runs as.
capabilities:
  notifications: true
  process: true
hooks:
  - notifications.send
ui:
  locales: [en, ru, es, ar]   # ui/locales/<lang>.json; en is the fallback
  config_section:
    schema: config-schema.json
