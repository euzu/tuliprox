schema_version: 1
name: stalker-live-resolution
# A Stalker/Ministra input resolves every playback through the portal's own `create_link`.
#
# The emulated portal answers with the fixture's stream URL, which lives on loopback. The SUT
# refuses that destination on purpose — a portal-supplied URL must never make the proxy talk to
# a private address — so this scenario asserts the resolution chain, not the media: the portal
# has to see one `create_link` per requested channel, carrying its descriptor's `cmd_1`.
# The raw `cmd` resolves the same marker, so the source check catches fallback regressions.
tuliprox:
  base_url: http://fixture.invalid
  execution_mode: isolated_fixture
  input_type: stalker
  bootstrap:
    command: "${env:TULIPROX_TESTKIT_SUT_BINARY}"
    arguments: ["-s", "-c", "{config_file}", "-i", "{source_file}", "-a", "{api_proxy_file}"]
    readiness_url: "{base_url}/healthcheck"
  stalker:
    mac_address: '00:1A:79:00:00:01'
    mag_preset: generic_safe
    separate_descriptor_command: true
origin:
  run_id: stalker-live-resolution
actors:
  - id: tv-a
    agent: local
    username: testkit
    user_agent: tuliprox-testkit/tv-a
channels:
  live-17: { origin_marker: 17, protocol: xtream_ts }
  live-19: { origin_marker: 19, protocol: xtream_ts }
steps:
  - command_id: resolve-17
    start:
      actor: tv-a
      playback_id: playback-17
      session_group: playback-17
      channel: live-17
    # The non-public create_link destination is refused; the m3u endpoint answers 400 for it.
    expect:
      http_error: 400
    assert_origin:
      stalker_create_links_at_least: 1
      stalker_token_refusals_at_least: 0
      stalker_create_link_markers: [17]
      stalker_descriptor_markers: [17]
      stalker_raw_command_markers: []
  - command_id: resolve-19
    start:
      actor: tv-a
      playback_id: playback-19
      session_group: playback-19
      channel: live-19
    expect:
      http_error: 400
    assert_origin:
      stalker_create_links_at_least: 2
      stalker_token_refusals_at_least: 0
      stalker_create_link_markers: [17, 19]
      stalker_descriptor_markers: [17, 19]
      stalker_raw_command_markers: []
