schema_version: 1
name: player-shared-kick-keeps-other-viewer
tuliprox:
  base_url: http://fixture.invalid
  execution_mode: isolated_fixture
  fixture_stream:
    share_live_hls: false
    share_live_mpeg_ts: true
  bootstrap:
    command: "${env:TULIPROX_TESTKIT_SUT_BINARY}"
    arguments: ["-s", "-c", "{config_file}", "-i", "{source_file}", "-a", "{api_proxy_file}"]
    readiness_url: "{base_url}/healthcheck"
origin:
  run_id: player-shared-kick-keeps-other-viewer
actors:
  - id: viewer-1
    agent: local
    username: viewer-1
    user_agent: tuliprox-testkit/viewer-1
  - id: viewer-2
    agent: local
    username: viewer-2
    user_agent: tuliprox-testkit/viewer-2
channels:
  channel-x: { origin_marker: 17, protocol: xtream_ts }
steps:
  - command_id: viewer-1-starts
    start:
      actor: viewer-1
      playback_id: playback-1
      session_group: group-1
      channel: channel-x
      expect_evicted: true
    await: { valid_frames: 2 }
  - command_id: viewer-2-joins
    start:
      actor: viewer-2
      playback_id: playback-2
      session_group: group-2
      channel: channel-x
    await: { valid_frames: 2 }
    assert_runtime:
      active_streams: 2
      distinct_shared_streams: 1
      provider_connections: 1
  - command_id: viewer-1-stops-via-api
    api_request:
      actor: viewer-1
      method: DELETE
      path: "/api/v1/me/streams/{uid}"
      playback_id: playback-1
      expect_status: 204
    assert_runtime:
      active_streams: 1
      distinct_shared_streams: 1
      provider_connections: 1
  - command_id: pause-viewer-2-keeps-receiving
    pause_millis: 1000
  - command_id: viewer-2-stops
    stop: { playback_id: playback-2 }
    assert_runtime:
      active_streams: 0
      provider_connections: 0
policy_contract:
  player_api: true
  user_access_control: true
  users:
    viewer-1: { max_connections: 2 }
    viewer-2: { max_connections: 2 }
  admission_strategies: []
  provider_max_connections: 1
