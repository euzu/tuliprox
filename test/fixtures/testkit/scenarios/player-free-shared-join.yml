schema_version: 1
name: player-free-shared-join
tuliprox:
  base_url: http://fixture.invalid
  execution_mode: isolated_fixture
  fixture_stream:
    share_live_hls: false
    share_live_mpeg_ts: true
  bootstrap:
    command: "${env:TULIPROX_TESTKIT_SUT_BINARY}"
    arguments: ["-s", "-c", "{config_file}", "-i", "{source_file}", "-a", "{api_proxy_file}"]
    readiness_url: "{base_url}/healthcheck"
origin:
  run_id: player-free-shared-join
actors:
  - id: paid-viewer
    agent: local
    username: paid-viewer
    user_agent: tuliprox-testkit/paid-viewer
  - id: joiner-dev1
    agent: local
    username: joiner
    user_agent: tuliprox-testkit/joiner-dev1
  - id: joiner-dev2
    agent: local
    username: joiner
    user_agent: tuliprox-testkit/joiner-dev2
channels:
  channel-x: { origin_marker: 17, protocol: xtream_ts }
  channel-y: { origin_marker: 18, protocol: xtream_ts }
steps:
  - command_id: paid-viewer-starts-x
    start:
      actor: paid-viewer
      playback_id: paid-x
      session_group: group-x
      channel: channel-x
    await: { valid_frames: 2 }
  - command_id: joiner-dev1-starts-y
    start:
      actor: joiner-dev1
      playback_id: joiner-y
      session_group: group-y
      channel: channel-y
    await: { valid_frames: 2 }
  - command_id: joiner-dev2-joins-x
    start:
      actor: joiner-dev2
      playback_id: joiner-x
      session_group: group-x
      channel: channel-x
      expect_evicted: true
    await: { valid_frames: 2 }
    assert_runtime:
      active_streams: 3
      distinct_shared_streams: 1
  - command_id: paid-viewer-leaves-x
    stop: { playback_id: paid-x }
    assert_runtime:
      active_streams: 1
  - command_id: joiner-dev1-stops-y
    stop: { playback_id: joiner-y }
    assert_runtime:
      active_streams: 0
      provider_connections: 0
policy_contract:
  player_api: true
  user_access_control: true
  users:
    paid-viewer: { max_connections: 2 }
    joiner:
      max_connections: 1
      player_features:
        free_shared_joins: true
        max_free_shared_joins: 1
  admission_strategies: []
