schema_version: 1
name: reentry-suppresses-evicted-retry
tuliprox:
  base_url: http://fixture.invalid
  execution_mode: isolated_fixture
  bootstrap:
    command: "${env:TULIPROX_TESTKIT_SUT_BINARY}"
    arguments: ["-s", "-c", "{config_file}", "-i", "{source_file}", "-a", "{api_proxy_file}"]
    readiness_url: "{base_url}/healthcheck"
origin: { run_id: reentry-suppresses-evicted-retry }
actors:
  - { id: tv-a, agent: local, username: admission-user, user_agent: tuliprox-testkit/reentry-a, client_ip: { mode: forwarded, value: 10.20.0.10 } }
  - { id: tv-b, agent: local, username: admission-user, user_agent: tuliprox-testkit/reentry-b, client_ip: { mode: forwarded, value: 10.20.0.10 } }
channels:
  live-17: { origin_marker: 17, protocol: xtream_ts }
  live-18: { origin_marker: 18, protocol: xtream_ts }
steps:
  - { command_id: start-a, start: { actor: tv-a, playback_id: playback-a, session_group: playback-a, channel: live-17 }, await: { valid_frames: 5 } }
  - { command_id: start-b, start: { actor: tv-b, playback_id: playback-b, session_group: playback-b, channel: live-18 }, await: { valid_frames: 5 } }
  # tv-a retries the channel it was just evicted from. The reentry guard must
  # suppress it quietly (HTTP 204) and keep playback-b streaming instead of
  # evicting playback-b back (playback ping-pong).
  - command_id: retry-a
    expect: suppressed
    start: { actor: tv-a, playback_id: playback-a-retry, session_group: playback-a-retry, channel: live-17 }
policy_contract:
  user_access_control: true
  users: { admission-user: { max_connections: 1 } }
  admission_strategies: [evict_user_oldest]
  recent_eviction_reentry_ttl_ms: 10000
