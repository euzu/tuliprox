[package]
name = "tuliprox-messaging"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Outbound notification delivery for tuliprox"

[lints]
workspace = true

[dependencies]
shared = { workspace = true }
tuliprox-core = { workspace = true }
arc-swap.workspace = true
chrono.workspace = true
futures.workspace = true
handlebars = "6.4.4"
hmac.workspace = true
sha2.workspace = true
log.workspace = true
mime.workspace = true
reqwest = { workspace = true, features = ["default", "json", "stream", "rustls", "socks", "form", "query"] }
serde.workspace = true
url.workspace = true
serde_json = { workspace = true, features = ["raw_value", "preserve_order"] }
tokio = { workspace = true, features = ["rt-multi-thread", "time", "macros", "process", "io-util"] }
tokio-util.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }
