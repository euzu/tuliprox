[package]
name = "tuliprox-repository"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Persistent playlist, EPG and user storage for tuliprox"

[lints]
workspace = true

[features]
# Publishes fixture constructors the dependent crate's tests need, such as a
# `GeoIp` that answers a fixed country. Enable from `[dev-dependencies]` only.
test-support = []

[dependencies]
shared = { workspace = true }
tuliprox-btree = { workspace = true }
tuliprox-core = { workspace = true }
tuliprox-parser = { workspace = true }
arc-swap.workspace = true
base64.workspace = true
bytes.workspace = true
chrono.workspace = true
crc32fast = "1.5.1"
env_logger = "0.11.11"
filetime = "0.2.29"
fs2 = "0.4.3"
futures.workspace = true
indexmap.workspace = true
log.workspace = true
lz4_flex.workspace = true
parking_lot = "0.12.5"
paste.workspace = true
rmp-serde = "1.3.1"
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value", "preserve_order"] }
tempfile = "3.27.0"
tokio = { workspace = true, features = ["rt-multi-thread", "parking_lot", "fs", "time", "macros", "sync"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tokio-util = { version = "0.7.19", features = ["io", "io-util"] }
url.workspace = true
uuid = { version = "1.26.0", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[dev-dependencies]
# The startup-migration tests build legacy v2 databases by hand.
tuliprox-btree = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["test-util", "macros"] }
