[package]
name = "tuliprox-repository"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Persistent playlist, EPG and user storage for tuliprox"

[lints]
workspace = true

[features]
# Publishes fixture constructors the dependent crate's tests need, such as a
# `GeoIp` that answers a fixed country. Enable from `[dev-dependencies]` only.
test-support = []

[dependencies]
shared = { workspace = true }
tuliprox-btree = { workspace = true }
tuliprox-core = { workspace = true }
tuliprox-parser = { workspace = true }
arc-swap.workspace = true
base64.workspace = true
blake3.workspace = true
bytes.workspace = true
chrono.workspace = true
crc32fast.workspace = true
env_logger.workspace = true
filetime.workspace = true
futures.workspace = true
indexmap.workspace = true
log.workspace = true
lz4_flex.workspace = true
parking_lot.workspace = true
paste.workspace = true
rmp-serde.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value", "preserve_order"] }
serde-saphyr.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "parking_lot", "fs", "time", "macros", "sync"] }
tokio-stream = { workspace = true, features = ["sync"] }
tokio-util = { workspace = true, features = ["io", "io-util"] }
url.workspace = true
uuid = { workspace = true, features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[dev-dependencies]
# The startup-migration tests build legacy v2 databases by hand.
tuliprox-btree = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["test-util", "macros"] }
