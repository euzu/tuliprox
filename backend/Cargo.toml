[package]
name = "tuliprox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lints]
workspace = true

[dependencies]
lol_html = "2.9.0"
handlebars = "6.4.1"
shared = { version = "3", path = "../shared" }
tuliprox-btree = { version = "3", path = "../btree" }
tuliprox-media-server = { version = "3", path = "../media-server" }
serde.workspace = true
serde-saphyr.workspace = true
serde_json = { workspace = true, features = ["raw_value", "preserve_order"] }
quick-xml = { version = "0.41", features = ["async-tokio", "serialize"] }
regex.workspace = true
clap = { version = "4.6.1", features = ["derive"] }
reqwest = { version = "0.13.4", features = ["json", "stream", "rustls", "socks", "form", "query"] }
url.workspace = true
chrono.workspace = true
iana-time-zone = "0.1.65"
cron.workspace = true
axum = { version = "0.8.9" , features = ["macros", "default", "ws"]}
serde_html_form = "0.4.0"
tower = "0.5.3"
tower-http = { version = "0.6.11", features = ["cors", "auth", "fs", "compression-full", "trace"] }
tower_governor = { version = "0.8.0", features = ["axum"] }
jsonwebtoken = { version = "10.4.0", default-features = false, features = ["aws_lc_rs"] }
rust-argon2 = "3.0.0"
futures.workspace = true
path-clean.workspace = true
pest.workspace = true
pest_derive.workspace = true
thiserror.workspace = true
aes = "0.8.4"
ctr = "0.9.2"
deunicode.workspace = true
mime = "0.3.17"
log.workspace = true
env_logger = "0.11.10"
rmp-serde = "1.3.1"
rand = "0.9.4"
fastrand.workspace = true
rpassword = "7.5.4"
flate2 = "1.1.9"
blake3.workspace = true
bytes.workspace = true
tokio-stream = { version = "0.1.18", features = ["sync"] }
tokio = { workspace = true, features = ["rt-multi-thread", "parking_lot", "fs", "process", "signal", "time", "macros"] }
#console-subscriber = "0"
#tracing = "0.1"
#tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tokio-util =  { version = "0.7.18", features = ["io", "io-util"] }
tempfile = "3.27.0"
filetime = "0.2.29"
strsim = "0.11.1"
rphonetic = "3.0.6"
rayon = "1.12.0"
base64.workspace = true
sha2.workspace = true
paste.workspace = true
indexmap.workspace = true
parking_lot = "0.12.5"
lz4_flex.workspace = true
brotli.workspace = true
memmap2 = "0.9.11"
smallvec = "1.15.1"
fs2 = "0.4.3"
notify = "8.2.0"
arc-swap.workspace = true
dashmap.workspace = true
hyper = "1.10.1"
hyper-util = "0.1.20"
socket2 = { version = "0.6.4", features = ["all"] }
async-compression = { version = "0.4.42", features = ["tokio", "brotli", "deflate", "gzip", "zlib", "zstd"] }
chrono-tz = "0.10.4"
zeroize.workspace = true
uuid = { version = "1.23.3", features = ["v4"] }
fancy-regex = "0.17.0"
mime_guess = "2.0.5"
crc32fast = "1.5.0"
memchr = "2.8.1"
mpeg2ts-reader = "0.18.2"
http-body-util = "0.1.3"
lru = "0.16.3"
ipnet = "2"
strum.workspace = true
strum_macros.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"
[target.'cfg(not(target_os = "linux"))'.dependencies]
sysinfo = { version = "0.38.4", default-features = false, features = ["system", "network"] }
[target.'cfg(target_os = "windows")'.dependencies]

winapi = { version = "0.3", features = ["psapi", "minwindef", "processthreadsapi", "sysinfoapi", "fileapi", "winbase"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading"] }
#[target.'cfg(target_os = "linux")'.dependencies]
#mimalloc = "0.1"
#[target.'cfg(not(target_env = "msvc"))'.dependencies]
#tikv-jemallocator =  "0.6"
# tikv-jemallocator =  { version = "*", features = ["profiling", "unprefixed_malloc_on_supported_platforms"] }

[build-dependencies]
vergen = { version = "9.1.0", features = ["build"] }

[dev-dependencies]
# The migration and playlist-stream tests build legacy v2 databases and
# sorted-index sidecars by hand; those builders live in the engine.
tuliprox-btree = { version = "3", path = "../btree", features = ["test-support"] }
tokio = { workspace = true, features = ["test-util", "macros"] }
rcgen = "0.14.8"
rustls = "0.23.40"
tokio-rustls = "0.26.4"

[features]
proxy-auth-regression = []


[[bin]]
name = "flags_builder"
path = "src/tools/flags_builder.rs"
