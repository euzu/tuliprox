[package]
name = "tuliprox-hls"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "HLS proxy: session and lease lifecycle, manifest refresh, segment cache and terminal tails"

[lints]
workspace = true

[features]
# Exposes helpers that are otherwise `#[cfg(test)]`, so the backend's own tests
# can drive the proxy. Enabled only from `[dev-dependencies]`; never in a build.
# Some of those helpers build `HlsTsSpliceEvidence` values, so they need the same
# feature on `tuliprox-mpegts`; forwarding it here keeps the feature self-contained
# instead of relying on the consumer to enable both.
test-support = ["tuliprox-mpegts/test-support"]

[dependencies]
shared = { workspace = true }
tuliprox-core = { workspace = true }
tuliprox-mpegts = { workspace = true }
tuliprox-parser = { workspace = true }
tuliprox-session = { workspace = true }
arc-swap.workspace = true
axum = { workspace = true, features = ["macros", "default", "ws"] }
bytes.workspace = true
chrono.workspace = true
base64.workspace = true
blake3.workspace = true
fastrand.workspace = true
sha2.workspace = true
thiserror.workspace = true
zeroize.workspace = true
rand.workspace = true
futures.workspace = true
log.workspace = true
lru.workspace = true
reqwest = { workspace = true, features = ["default", "json", "stream", "rustls", "socks", "form", "query"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "fs", "time", "macros", "sync"] }
tokio-util = { workspace = true, features = ["io", "io-util"] }
url.workspace = true
http-body-util.workspace = true
hyper-util = { workspace = true, features = ["client-legacy"] }

[dev-dependencies]
rand.workspace = true
tempfile.workspace = true
tuliprox-mpegts = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["test-util"] }
async-compression = { workspace = true, features = ["tokio", "brotli", "deflate", "gzip", "zlib", "zstd"] }
filetime.workspace = true
flate2.workspace = true
brotli.workspace = true

rcgen.workspace = true
tokio-rustls.workspace = true
