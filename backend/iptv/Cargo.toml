[package]
name = "tuliprox-iptv"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Provider clients for Xtream, M3U and Stalker portals"

[lints]
workspace = true

[features]
test-support = ["tuliprox-repository/test-support"]

[dependencies]
shared = { workspace = true }
tuliprox-core = { workspace = true }
tuliprox-parser = { workspace = true }
tuliprox-repository = { workspace = true }
base64.workspace = true
bytes.workspace = true
chrono.workspace = true
futures.workspace = true
log.workspace = true
parking_lot.workspace = true
reqwest = { workspace = true, features = ["default", "json", "stream", "rustls", "socks", "form", "query"] }
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value", "preserve_order"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "fs", "time", "macros"] }
tokio-util = { workspace = true, features = ["io", "io-util"] }
url.workspace = true

[dev-dependencies]
tuliprox-repository = { workspace = true, features = ["test-support"] }
http.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util", "macros"] }
