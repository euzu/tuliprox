[package]
name = "tuliprox-metadata"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Background metadata resolution: series, VOD and live detail fetched after a playlist update"

[lints]
workspace = true

[features]
# `enrich-metadata` in the background worker (plan §6). Enabled by the binary
# together with its own `plugins` feature, so `ctx::WorkerPlugins` and the
# binary's `AppPlugins` are always the same type.
plugins = ["dep:tuliprox-plugins"]

[dependencies]
shared = { workspace = true }
tuliprox-core = { workspace = true }
tuliprox-processing = { workspace = true }
tuliprox-repository = { workspace = true }
tuliprox-session = { workspace = true }
tuliprox-plugins = { workspace = true, optional = true }
arc-swap.workspace = true
chrono.workspace = true
dashmap.workspace = true
fastrand.workspace = true
log.workspace = true
parking_lot = "0.12.5"
reqwest = { version = "0.13.5", features = ["json", "stream", "rustls", "socks", "form", "query"] }
serde.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "fs", "time", "macros", "sync"] }
tokio-util = { version = "0.7.19", features = ["io", "io-util"] }

[dev-dependencies]
tempfile = "3.27.0"
rmp-serde = "1.3.1"
tokio = { workspace = true, features = ["test-util", "macros"] }
