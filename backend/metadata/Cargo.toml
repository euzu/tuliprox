[package]
name = "tuliprox-metadata"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Background metadata resolution: series, VOD and live detail fetched after a playlist update"

[lints]
workspace = true

[dependencies]
shared = { version = "3", path = "../../shared" }
tuliprox-core = { version = "3", path = "../core" }
tuliprox-processing = { version = "3", path = "../processing" }
tuliprox-repository = { version = "3", path = "../repository" }
tuliprox-session = { version = "3", path = "../session" }
arc-swap.workspace = true
chrono.workspace = true
dashmap.workspace = true
fastrand.workspace = true
log.workspace = true
parking_lot = "0.12.5"
reqwest = { version = "0.13.4", features = ["json", "stream", "rustls", "socks", "form", "query"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "fs", "time", "macros", "sync"] }
tokio-util = { version = "0.7.19", features = ["io", "io-util"] }

[dev-dependencies]
tempfile = "3.27.0"
rmp-serde = "1.3.1"
tokio = { workspace = true, features = ["test-util", "macros"] }
