[package]
name = "tuliprox-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Resolved configuration model and shared utilities for tuliprox"

[lints]
workspace = true

[dependencies]
http-body-util.workspace = true
serde_html_form.workspace = true
shared = { workspace = true }
tuliprox-mpegts = { workspace = true }
tuliprox-media-server = { workspace = true }
tuliprox-scripting = { workspace = true }
aes.workspace = true
arc-swap.workspace = true
async-compression = { workspace = true, features = ["tokio", "brotli", "deflate", "gzip", "zlib", "zstd"] }
axum = { workspace = true, features = ["macros", "default", "ws"] }
base64.workspace = true
blake3.workspace = true
bytes.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
ctr.workspace = true
env_filter = "2"
env_logger.workspace = true
fastrand.workspace = true
flate2.workspace = true
futures.workspace = true
indexmap.workspace = true
ipnet = "2"
log.workspace = true
lru.workspace = true
parking_lot.workspace = true
paste.workspace = true
path-clean.workspace = true
quick-xml = { workspace = true, features = ["async-tokio", "serialize"] }
rand.workspace = true
rmp-serde.workspace = true
regex.workspace = true
reqwest = { workspace = true, features = ["default", "json", "stream", "rustls", "socks", "form", "query"] }
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value", "preserve_order"] }
serde-saphyr.workspace = true
strum.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "parking_lot", "fs", "process", "signal", "time", "macros"] }
tokio-stream = { workspace = true, features = ["sync"] }
tokio-util = { workspace = true, features = ["io", "io-util"] }
url.workspace = true
zeroize.workspace = true

[target.'cfg(not(target_os = "linux"))'.dependencies]
sysinfo = { workspace = true, features = ["system", "network"] }
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }
