[package]
name = "tuliprox-curation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Source-neutral playlist curation with Trakt and TMDB Trending adapters for tuliprox"

[lints]
workspace = true

[dependencies]
shared = { workspace = true }
tuliprox-core = { workspace = true }
indexmap.workspace = true
log.workspace = true
mime.workspace = true
regex.workspace = true
reqwest = { workspace = true, features = ["default", "json", "rustls"] }
serde.workspace = true
serde_json.workspace = true
strsim.workspace = true
tokio = { workspace = true, features = ["io-util", "time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "test-util"] }
