[package]
name = "tuliprox-session"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Provider allocation and streaming-session runtime: admission, connections, users, events and shared streams"

[lints]
workspace = true

[dependencies]
shared = { workspace = true }
tuliprox-core = { workspace = true }
tuliprox-mpegts = { workspace = true }
tuliprox-repository = { workspace = true }
arc-swap.workspace = true
axum = { workspace = true, features = ["macros", "default", "ws"] }
bytes.workspace = true
chrono.workspace = true
cookie.workspace = true
dashmap.workspace = true
futures.workspace = true
jsonwebtoken = { workspace = true, features = ["aws_lc_rs"] }
log.workspace = true
rand.workspace = true
reqwest = { workspace = true, features = ["default", "json", "stream", "rustls", "socks", "form", "query"] }
thiserror.workspace = true
lru.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "fs", "time", "macros", "sync"] }
tokio-stream = { workspace = true, features = ["sync"] }
tokio-util = { workspace = true, features = ["io", "io-util"] }
url.workspace = true

[dev-dependencies]
tempfile.workspace = true
crc32fast.workspace = true
tokio = { workspace = true, features = ["test-util"] }
