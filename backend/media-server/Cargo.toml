[package]
name = "tuliprox-media-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Anti-corruption layer for Emby/Jellyfin/Plex media servers"

[lints]
workspace = true

[dependencies]
bytes.workspace = true
chrono.workspace = true
futures.workspace = true
http.workspace = true
quick-xml = { workspace = true, features = ["async-tokio", "serialize"] }
reqwest = { workspace = true, features = ["default", "json", "stream", "rustls", "socks", "form", "query"] }
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value", "preserve_order"] }
shared = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "parking_lot", "time", "macros"] }
url.workspace = true

[dev-dependencies]
# The Plex client's tests stand up a local HTTP server to drive the client
# against; hyper is not used by the module itself.
http-body-util.workspace = true
hyper.workspace = true
hyper-util = { workspace = true, features = ["server", "server-auto", "tokio"] }
