[package]
name = "tuliprox-parser"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Provider wire-format parsing and URL building for tuliprox"

[lints]
workspace = true

[dependencies]
shared = { version = "3", path = "../shared" }
tuliprox-core = { version = "3", path = "../core" }
aes = "0.8.4"
base64.workspace = true
chrono.workspace = true
chrono-tz = "0.10.4"
ctr = "0.9.2"
indexmap.workspace = true
log.workspace = true
regex.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value", "preserve_order"] }
tokio = { workspace = true, features = ["rt-multi-thread", "fs", "time", "macros"] }
tokio-util = { version = "0.7.18", features = ["io", "io-util"] }
url.workspace = true

[dev-dependencies]
rand = "0.9.4"
tempfile = "3.27.0"
tokio = { workspace = true, features = ["test-util", "macros"] }
