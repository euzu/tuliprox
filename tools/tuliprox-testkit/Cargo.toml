[package]
name = "tuliprox-testkit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
axum = { workspace = true, features = ["macros", "default", "ws"] }
base64.workspace = true
blake3.workspace = true
bytes.workspace = true
clap = { workspace = true, features = ["derive"] }
chrono.workspace = true
crc32fast.workspace = true
futures.workspace = true
reqwest = { workspace = true, features = ["default", "json", "stream", "rustls"] }
serde.workspace = true
serde_json.workspace = true
serde-saphyr.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "process", "signal", "sync", "time"] }
tokio-tungstenite.workspace = true
tempfile.workspace = true
pin-project-lite = "0.2.17"
url.workspace = true
hyper = { workspace = true, features = ["server", "http1"] }
hyper-util = { workspace = true, features = ["server", "server-auto", "tokio"] }
tower-service = "0.3.3"

[dev-dependencies]
tuliprox-mpegts.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tokio-stream.workspace = true
