server:
- name: default
  protocol: http
  host: 127.0.0.1
  port: "8901"
  timezone: Europe/Paris
  message: Welcome to m3u-filter
- name: external
  protocol: https
  host: localhost
  port: "443"
  timezone: Europe/Paris
  message: Welcome to m3u-filter
user:
- target: iptv-org
  credentials:
  - username: local
    password: localsecret
    token: "77417"
    proxy: reverse
    server: default
    exp_date: 0
    max_connections: 0
    status: Active
    soft_connections: 0
  - username: vpn-only
    password: vpnsecret
    proxy: reverse
    server: external
    max_connections: 2
    status: Active
    ui_enabled: false
    soft_connections: 0
    network_access:
      allowed_countries:
      - DE
      - AT
      allowed_networks:
      - 10.200.0.0/16
  - username: external
    password: externalsecret
    token: "77418"
    proxy: reverse
    server: external
    exp_date: 0
    max_connections: 0
    status: Active
    soft_connections: 0
