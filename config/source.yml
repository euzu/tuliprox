templates:
  - name: not_red_button
    value: 'NOT (Title ~ "(?i).*red button.*")'
  - name: not_low_resolution
    value: 'NOT (Title ~ "(?i).*\(360p|240p\).*")'
  - name: all_channels
    value: 'Title ~ ".*"'
  - name: final_channel_lineup
    value: "!all_channels! AND !not_red_button! AND !not_low_resolution!"
inputs:
  - name: iptv-org
    type: m3u
    url: https://iptv-org.github.io/iptv/countries/uk.m3u
sources:
  - inputs:
      - iptv-org
    targets:
      - name: iptv-org
        output:
          - type: xtream
          - type: m3u
            filename: iptv.m3u
          - type: hdhomerun
            username: local
            device: hdhr1
        filter: "!final_channel_lineup!"
        options:
          ignore_logo: false
          clear_invalid_epg_ids: false
          epg_output:
            lowercase_ids: false
            lowercase_xmltv_display_names: false
          share_live_streams:
            hls: true
            mpeg_ts: true
        mapping:
          - iptv-org
      # Link this example to your authorized VOD/Series input with TMDB IDs, not just the demo Live feed.
      - name: tmdb-discovery-example
        enabled: false
        curation:
          # Enable target and curation after providing your own application Read Access Token.
          enabled: false
          catalog_selection: full
          include_xtream_base_categories: true
          tmdb:
            api:
              # See docs for the TMDB_READ_ACCESS_TOKEN environment-variable example; no metadata-key fallback.
              access_token: ""
            trending:
              - kind: movie
                time_window: week
                scope: first_page
                category_name: TMDB Weekly Movies
              - kind: tv
                time_window: day
                scope: first_page
                category_name: TMDB Daily TV
        output:
          - type: xtream
          - type: m3u
            filename: tmdb-discovery.m3u
      - name: iptv-trakt-example
        output:
          - type: xtream
            skip_live_direct_source: true
            skip_video_direct_source: true
            skip_series_direct_source: true
            trakt:
              # Set enabled to true after configuring api.api_key with your Trakt Client ID.
              # See the documentation for the TRAKT_CLIENT_ID environment-variable example.
              enabled: false
              # "full" preserves the entire catalog (default); "curated" keeps selected VOD/Series plus all Live.
              catalog_selection: curated
              include_xtream_base_categories: true
              api:
                api_key: ""
              lists:
                - user: "linaspurinis"
                  list_slug: "top-watched-movies-of-the-week"
                  category_name: "📈 Top Weekly Movies"
                  create_xtream_category: true
                  content_type: "vod"
                  fuzzy_match_threshold: 80
                - user: "garycrawfordgc"
                  list_slug: "latest-tv-shows"
                  category_name: "📺 Latest TV Shows"
                  content_type: "series"
                  fuzzy_match_threshold: 75
                - user: "trakt"
                  list_slug: "trending"
                  # Selection-only selectors contribute memberships without creating an Xtream alias category.
                  create_xtream_category: false
                  content_type: "both"
                  fuzzy_match_threshold: 80
                - user: "mmozeiko"
                  list_slug: "star-wars-universe"
                  category_name: "🌌 Univers Star Wars"
                  content_type: "both"
                  fuzzy_match_threshold: 80
        filter: "!final_channel_lineup!"
        options:
          ignore_logo: false
          clear_invalid_epg_ids: false
          epg_output:
            lowercase_ids: false
            lowercase_xmltv_display_names: false
          share_live_streams:
            hls: true
            mpeg_ts: true
