name: Docker Build and Push

permissions:
  contents: write
  packages: write

on:
  workflow_dispatch:
    inputs:
      branch:
        type: choice
        description: Target branch
        options: [develop, experimental, master]
        default: develop
  push:
    branches: [develop, experimental, master]

# Avoid multiple parallel builds for the same branch to prevent race conditions
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || github.ref_name }}
  cancel-in-progress: false # Set to true if you want to abort old builds immediately

jobs:
  docker-build:
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/experimental' || github.ref == 'refs/heads/master') &&
      (github.event_name != 'push' || github.actor != 'github-actions[bot]')

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Ensure we always have the right branch context
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || github.ref }}

      - name: Install Rust Tools (Binaries)
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cross,trunk,wasm-bindgen-cli,cargo-edit,mdbook

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl,wasm32-unknown-unknown

      - name: Install wasm tools 128
        run: |
          chmod +x ./bin/install_wasm_tools.sh
          WASM_TOOLS_BIN="$(./bin/install_wasm_tools.sh 128)"
          echo "${WASM_TOOLS_BIN}" >> "$GITHUB_PATH"

      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-targets: "true"
          # Rare master releases build two extra targets; saving them would evict the develop caches.
          save-if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.branch || github.ref_name) != 'master' }}

      - name: Handle Version Bump
        env:
          RELEASE_BRANCH: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || github.ref_name }}
        run: |
          # Version rules: develop always raises the patch (never 0); master always raises the minor (patch 0).
          if [[ "$RELEASE_BRANCH" == "experimental" ]]; then
            echo "🔬 Experimental builds do not bump versions; keeping version from develop."
            exit 0
          fi
          current=$(grep -Po '^version\s*=\s*"\K[0-9\.]+' ./Cargo.toml | head -n1)
          head_commit=$(git rev-parse HEAD)
          tag_commit() { git rev-parse -q --verify "refs/tags/v$1^{commit}" || true; }
          # A tag on another commit belongs to an earlier release. A tag on HEAD is a re-run of this release.
          tag_taken() {
            local tagged
            tagged=$(tag_commit "$1")
            [[ -n "$tagged" && "$tagged" != "$head_commit" ]]
          }
          if [[ "$(tag_commit "$current")" == "$head_commit" ]]; then
            echo "Reusing version v$current already tagged at HEAD."
            exit 0
          fi
          IFS='.' read -r major minor patch <<< "$current"
          case "$RELEASE_BRANCH" in
            develop)
              # Continue after the newest master release when develop still carries an older minor.
              release=$(git tag -l 'v*.*.0' --sort=-v:refname | head -n1)
              IFS='.' read -r release_major release_minor _ <<< "${release#v}"
              if [[ -n "$release" ]] &&
                 (( release_major > major || (release_major == major && release_minor > minor) )); then
                major=$release_major
                minor=$release_minor
                patch=0
              fi
              patch=$((patch + 1))
              while tag_taken "$major.$minor.$patch"; do
                patch=$((patch + 1))
              done
              ;;
            master)
              minor=$((minor + 1))
              patch=0
              while tag_taken "$major.$minor.$patch"; do
                minor=$((minor + 1))
              done
              ;;
            *) echo "Unsupported release branch: $RELEASE_BRANCH" >&2; exit 1 ;;
          esac
          echo "🛠️ Set version v$major.$minor.$patch (was v$current)"
          cargo set-version "$major.$minor.$patch"

      - name: Read project version
        id: version
        run: |
          VERSION=$(grep -Po '^version\s*=\s*"\K[0-9\.]+' ./Cargo.toml)
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Cache built resources
        id: cache-resources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: resources/*.ts
          key: ${{ runner.os }}-resources-${{ hashFiles('resources/*.jpg') }}

      - name: Install ffmpeg
        if: steps.cache-resources.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Build TS resources
        if: steps.cache-resources.outputs.cache-hit != 'true'
        run: |
          chmod +x ./bin/build_resources.sh
          ./bin/build_resources.sh

      - name: Verify TS resources
        run: |
          required_resources=(
            "channel_unavailable"
            "user_connections_exhausted"
            "provider_connections_exhausted"
            "user_account_expired"
            "panel_api_provisioning"
            "maintenance"
          )
          for resource in "${required_resources[@]}"; do
            if [[ ! -f "resources/${resource}.ts" ]]; then
              echo "🧨 Missing resource: resources/${resource}.ts"
              exit 1
            fi
          done
      - name: Commit version bump
        id: version_commit
        run: |
          git config user.name "euzu"
          git config user.email "euzu@proton.me"
          echo "base_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git add -- Cargo.toml Cargo.lock frontend/Cargo.toml
          if ! git diff --cached --quiet; then
            VERSION=$(grep -Po '^version\s*=\s*"\K[0-9\.]+' ./Cargo.toml | head -n1)
            git commit --only -m "ci: bump version v$VERSION" -- Cargo.toml Cargo.lock frontend/Cargo.toml
          fi

      - name: Prepare release tag
        env:
          RELEASE_BRANCH: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || github.ref_name }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          if [[ "$RELEASE_BRANCH" == "experimental" ]]; then
            exit 0
          fi
          if git show-ref --verify --quiet "refs/tags/v$VERSION"; then
            if [[ "$(git rev-parse "refs/tags/v$VERSION^{commit}")" != "$(git rev-parse HEAD)" ]]; then
              echo "Refusing to replace v$VERSION: the tag belongs to a different commit." >&2
              exit 1
            fi
          else
            git config user.name "euzu"
            git config user.email "euzu@proton.me"
            git tag -a "v$VERSION" -m "v$VERSION"
          fi

      - name: Build release bundles and Docker context
        env:
          RELEASE_BRANCH: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || github.ref_name }}
        run: |
          chmod +x ./bin/build_docker.sh
          ./bin/build_docker.sh "$RELEASE_BRANCH" build

      - name: Verify release bundle artifacts
        env:
          RELEASE_BRANCH: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || github.ref_name }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          ls -la artifacts
          bundles=(x86_64-unknown-linux-musl.tar.gz aarch64-unknown-linux-musl.tar.gz)
          if [[ "$RELEASE_BRANCH" == "master" ]]; then
            bundles+=(armv7-unknown-linux-musleabihf.tar.gz x86_64-pc-windows-gnu.zip)
          fi
          for bundle in "${bundles[@]}"; do
            artifact="artifacts/tuliprox-v${VERSION}-${bundle}"
            test -f "${artifact}"
            test -f "${artifact}.sha256"
            if [[ "$artifact" == *.zip ]]; then
              listing=$(unzip -Z1 "${artifact}")
              binary=tuliprox/tuliprox.exe
            else
              listing=$(tar -tzf "${artifact}")
              binary=tuliprox/tuliprox
            fi
            for required_path in "$binary" tuliprox/web/ tuliprox/resources/; do
              grep -qx "${required_path}" <<< "${listing}"
            done
          done
          for sum_file in artifacts/*.sha256; do
            (cd artifacts && sha256sum -c "$(basename "$sum_file")")
          done

      - name: Build release checksum notes
        run: |
          {
            echo "## Release Bundle Checksums"
            echo
            echo "The checksums below were validated in CI via \`sha256sum -c\` before upload."
            echo
            echo "| File | SHA256 |"
            echo "| --- | --- |"
            for sum_file in artifacts/*.sha256; do
              checksum=$(awk '{print $1}' "$sum_file")
              filename=$(awk '{print $2}' "$sum_file")
              echo "| \`$filename\` | \`$checksum\` |"
            done
            echo
            echo "Verification command after download:"
            echo "\`\`\`bash"
            echo "sha256sum -c *.sha256"
            echo "\`\`\`"
          } > artifacts/RELEASE_NOTES_SHA256.md

      - name: Publish version commit and tag
        env:
          RELEASE_BRANCH: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || github.ref_name }}
          VERSION: ${{ steps.version.outputs.value }}
          BASE_COMMIT: ${{ steps.version_commit.outputs.base_commit }}
        run: |
          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo "Refusing to publish: tracked files changed after the version commit." >&2
            exit 1
          fi
          expected_commit="${BASE_COMMIT:-$(git rev-parse HEAD)}"
          # Keep ls-remote outside a pipeline so a failed lookup stops the step with its own error.
          if ! remote_line=$(git ls-remote --exit-code origin "refs/heads/$RELEASE_BRANCH"); then
            echo "Refusing to publish: cannot read $RELEASE_BRANCH from origin." >&2
            exit 1
          fi
          remote_commit=${remote_line%%[[:space:]]*}
          if [[ "$remote_commit" != "$expected_commit" ]]; then
            echo "Refusing to publish: $RELEASE_BRANCH changed during the build. Start a new run from the current branch." >&2
            exit 1
          fi
          if [[ "$RELEASE_BRANCH" != "experimental" ]]; then
            git push --atomic origin "HEAD:refs/heads/$RELEASE_BRANCH" "refs/tags/v$VERSION:refs/tags/v$VERSION"
          fi

      - name: Publish Docker images
        env:
          GITHUB_IO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
          RELEASE_BRANCH: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || github.ref_name }}
        run: |
          ./bin/build_docker.sh "$RELEASE_BRANCH" publish

      - name: Upload release bundle artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tuliprox-release-v${{ steps.version.outputs.value }}
          path: artifacts/*
          if-no-files-found: error

      - name: Publish release bundles to GitHub Release
        if: >-
          success() && (
            (github.event_name == 'workflow_dispatch' && github.event.inputs.branch == 'master') ||
            (github.event_name == 'push' && github.ref == 'refs/heads/master')
          )
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: v${{ steps.version.outputs.value }}
          # Every verified bundle and checksum; GitHub attaches the source archives itself.
          files: |
            artifacts/tuliprox-v${{ steps.version.outputs.value }}-*
          body_path: artifacts/RELEASE_NOTES_SHA256.md
          generate_release_notes: true

      - name: Merge master release back into develop
        if: >-
          success() && (
            (github.event_name == 'workflow_dispatch' && github.event.inputs.branch == 'master') ||
            (github.event_name == 'push' && github.ref == 'refs/heads/master')
          )
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          # Without the master version commit in develop, the next release pull request conflicts on the version lines.
          git config user.name "euzu"
          git config user.email "euzu@proton.me"
          version_files=(Cargo.toml Cargo.lock frontend/Cargo.toml)
          for attempt in 1 2 3; do
            git fetch --quiet origin refs/heads/develop:refs/remotes/origin/develop
            if git merge-base --is-ancestor "refs/tags/v$VERSION" origin/develop; then
              echo "develop already contains v$VERSION."
              exit 0
            fi
            # develop keeps its own copy of the version files below. That is only safe while master changed
            # nothing in them except the release version lines; anything else needs a manual merge.
            # Every changed line must differ only in `version = "..."` (package version or a workspace path
            # dependency such as `shared = { version = "X", path = "../shared" }`), and the new value must be
            # this release. A failing git diff stops the step instead of passing the gate.
            base=$(git merge-base origin/develop "refs/tags/v$VERSION")
            changes=$(git diff -U0 "$base" "refs/tags/v$VERSION" -- "${version_files[@]}")
            removed=$(grep -E '^-' <<< "$changes" | grep -vE '^--- ' |
              sed -E 's/^-//; s/version = "[0-9.]+"/version = "V"/' | sort)
            added=$(grep -E '^\+' <<< "$changes" | grep -vE '^\+\+\+ ' |
              sed -E "s/^\+//; s/version = \"${VERSION//./\\.}\"/version = \"V\"/" | sort)
            if [[ "$removed" != "$added" ]]; then
              echo "Refusing to merge v$VERSION into develop: master changed more than the version in" \
                "${version_files[*]}. Merge master into develop manually." >&2
              exit 1
            fi
            git checkout --quiet -B release-sync origin/develop
            if ! git merge --no-ff --no-commit "refs/tags/v$VERSION"; then
              mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
              for file in "${conflicts[@]}"; do
                if [[ ! " ${version_files[*]} " == *" $file "* ]]; then
                  echo "Refusing to merge v$VERSION into develop: $file conflicts. Merge master into develop manually." >&2
                  git merge --abort
                  exit 1
                fi
              done
            fi
            # develop keeps its own version (patch never 0); its next build continues after this release.
            git checkout origin/develop -- "${version_files[@]}"
            git commit --quiet -m "ci: merge release v$VERSION into develop"
            if git push origin HEAD:refs/heads/develop; then
              exit 0
            fi
            echo "develop moved during the merge; retrying ($attempt of 3)."
          done
          echo "Cannot merge v$VERSION into develop. Merge master into develop manually." >&2
          exit 1
