[package]
name = "tuliprox-config-loader"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Application configuration bootstrap for tuliprox"

[lints]
workspace = true

[dependencies]
shared = { version = "3", path = "../shared" }
tuliprox-core = { version = "3", path = "../core" }
tuliprox-repository = { version = "3", path = "../repository" }
arc-swap.workspace = true
chrono.workspace = true
log.workspace = true
serde.workspace = true
serde-saphyr.workspace = true
tempfile = "3.27.0"
tokio = { workspace = true, features = ["rt-multi-thread", "fs", "macros"] }
url.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3", features = ["psapi", "minwindef", "processthreadsapi", "sysinfoapi", "fileapi", "winbase"] }
