  /api/v1/recording/availability:
    get:
      tags:
        - Recordings
      operationId: getRecordingAvailability
      summary: Preflight check for DVR availability
      description: |
        Preflight check to verify that the DVR subsystem is enabled and accessible.
        Requires that the caller has any recording permission (`read`, `private`, or `shared`).
        Returns `204 No Content` if enabled, `501 Not Implemented` if DVR is disabled on the server,
        or `403 Forbidden` if caller lacks recording features.
      security:
        - bearerAuth: []
      x-required-feature: recording (read, private, or shared)
      responses:
        '204':
          description: DVR subsystem is active and accessible.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '501':
          $ref: '#/components/responses/RecordingDisabledError'

  /api/v1/recording/requests:
    post:
      tags:
        - Recordings
      operationId: createRecordingRequest
      summary: Schedule a recording request
      description: |
        Schedules a live TV programme recording or initiates a VOD/Series transfer.
        Supports idempotent submission via the `Idempotency-Key` HTTP header.

        **Requirements & Constraints**:
        - Requires `player_features.recording` set to `private` (for private recordings) or `shared` (for shared recordings).
        - Source channel must belong to the user's target and pass their content filter.
        - Personal storage quota (`recording_quota`) and concurrent recording limits (`max_concurrent_recordings`)
          are verified upon admission.
      security:
        - bearerAuth: []
      x-required-feature: recording (private or shared)
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Client-supplied idempotency key preventing duplicate recording creation.
          schema:
            type: string
          example: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRecordingRequest'
            example:
              source:
                target_id: main
                virtual_id: "1001"
                cluster: Live
                input_name: sat-feed-1
              program_title: FA Cup Quarter Final
              program_start: 1740045600
              program_end: 1740052800
              pre_roll_secs: 120
              post_roll_secs: 300
              visibility: private
              channel_id: sports1.example.com
              channel_name: Sports 1 HD
      responses:
        '204':
          description: Recording request scheduled successfully (or idempotent replay).
        '400':
          description: Admission rejected due to quota or concurrency limits.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                quota_exceeded:
                  value:
                    error: recording_quota_exceeded
                concurrency_exceeded:
                  value:
                    error: recording_concurrency_exceeded
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          description: Validation failure on recording parameters or source.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: recording_invalid_interval
        '501':
          $ref: '#/components/responses/RecordingDisabledError'

  /api/v1/recording/requests/{id}:
    patch:
      tags:
        - Recordings
      operationId: editRecordingRequest
      summary: Edit a scheduled recording request
      description: |
        Modifies padding times or metadata of a pending recording request owned by the caller.
        Visibility cannot be edited after creation.
      security:
