openapi: 3.1.0
info:
  title: Tuliprox Integration API
  version: 3.3.205
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  description: |
    # Tuliprox Integration API Specification

    The Tuliprox Integration API provides third-party developers (building IPTV player
    applications, set-top-box frontends, home automation platforms, and AI agents) with
    direct access to playlist user services, personalized stream orchestration, failover
    switching, and personal DVR recording.

    ## Scope & Audience

    This specification covers the integration surface available to playlist proxy users
    authenticated via credentials defined in `api_proxy.yml`.

    ### Covered Scope:
    1. **Authentication (`/auth/token`, `/auth/refresh`)**: Playlist user credential exchange,
       Bearer JWT lifecycle, live permissions, and token revocation.
    2. **Player API (`/api/v1/me/*`)**: User capability discovery, stream inspection, stream
       termination, failover group source member discovery, manual source switching, split of shared
       streams into dedicated connections, joinable shared streams (including compatible streams of
       other targets), personal watch progress, the JSON event WebSocket, and filtered live channel/EPG
       queries. All `/api/v1/me/*` routes require the effective Player API switches
       (`web_ui.player_api_enabled`, unset follows `user_ui_enabled`; `player_features.api_enabled`, unset
       follows `ui_enabled`); otherwise the server returns `403 Forbidden`.
    3. **User Playlist / Bouquet API (`/api/v1/user/playlist/*`)**: Personalized cluster
       categories and user bouquet selection. Note: target-wide bouquet management
       (`/target-bouquets/*`) requires administrative permissions (`playlist.read`/`playlist.write`)
       and is reserved for administrators.
    4. **Recordings & Media (`/api/v1/recording/*`, `/api/v1/library/recording/*`)**: Personal
       DVR preflight, request scheduling, task editing, cancellation, conflict preview, recurring
       weekly recording rules, and HTTP Range media streaming/downloads.
    5. **Playback Contracts**: Plain HTTP GET stream URLs for Xtream Codes and M3U playback,
       together with diagnostic headers (`X-Tuliprox-Fallback`, `X-Tuliprox-Rejection`) and CORS exposure.
    6. **Model Context Protocol (MCP) & WebSocket**: Described below as protocol guides.

    ### Out of Scope:
    - Administrator-only endpoints (system configuration, global user management, plugin management,
      reseller panel API, and administrative failover management) are strictly reserved for operator
      tooling. For administrative workflows, refer to the [REST API Cookbook](docs/src/rest-api-cookbook.md).

    ---

    ## Model Context Protocol (MCP)

    Tuliprox exposes a Model Context Protocol (MCP) server over a stateless JSON-RPC 2.0 endpoint at
    `POST {web_ui_path}/mcp`. The server allows AI assistants and agentic clients to inspect and operate
    the player surface using dedicated tools.

    - **Configuration**: Controlled by `mcp.enabled: true` and `mcp.player_tools: off | read | write`.
      When `player_tools: off`, player tools are withheld. When `read`, only inspection and search tools
      are offered. When `write`, recording and stream management tools are also exposed.
    - **Authentication & RBAC**: Every MCP tool call is dispatched in-process with the caller's Bearer token
      into the existing REST router. Effective features and live permissions are enforced identically.
    - **Player Tool Catalog (17 tools)**:
      1. `me_capabilities`: Discovers caller capabilities, limits, quotas, and active connection counts (no arguments).
      2. `me_search_channels`: Search visible live channels with query text, group, or limit (`query`, `group`, `limit`).
      3. `me_get_epg`: Get EPG programme listings for a channel (`vid` [required], `from`, `to`).
      4. `me_list_streams`: List active playback streams of the caller (no arguments).
      5. `me_stop_stream`: Terminate an own active stream (`uid` [required]).
      6. `me_list_sources`: List available failover source members with health status and media quality for a group channel (`vid` [required]).
      7. `me_switch_source`: Switch an active stream to another failover member (`uid` [required], `member_vid` [required]).
      8. `me_split_stream`: Split an own shared live MPEG-TS stream into a dedicated connection (`uid` [required]); the returned URL replaces the password with `***`.
      9. `me_list_joinable`: List joinable running shared streams (no arguments).
      10. `me_list_recordings`: Internal snapshot dispatch listing user recordings and tasks (no arguments).
      11. `me_record_program`: Schedule a live recording (`vid` [required], `program_start` [required], `program_end` [required], `title` [required], `visibility`, `pre_roll_secs`, `post_roll_secs`).
      12. `me_cancel_recording`: Cancel an active or scheduled recording request (`id` [required]).
      13. `me_delete_recording`: Delete a completed or failed recording request (`id` [required]).
      14. `me_recording_conflicts`: Preview recording conflict demand (`vid` [required], `program_start` [required], `program_end` [required], `pre_roll_secs`, `post_roll_secs`, `priority`).
      15. `me_list_rules`: List recurring recording rules visible to the caller (no arguments).
      16. `me_create_rule`: Create a weekly timeslot rule (`vid` [required], `weekday` [required], `local_start_time` [required], `duration_secs` [required], `timezone`, `visibility`, `pre_roll_secs`, `post_roll_secs`).
      17. `me_delete_rule`: Delete a recording rule (`id` [required], `future` optional, default `retain`).

    For comprehensive MCP client configuration and tool details, see `docs/src/player-api.md`.

    ---

    ## WebSocket Protocol & One-Shot Recording Snapshot

    The Web UI and external clients connect to the WebSocket endpoint at `GET {web_ui_path}/ws`.
    All application frames (except the 1-byte protocol version frame) are JSON objects serialized
    into WebSocket **binary** frames.

    ### Connection & One-Shot Snapshot Flow:
    1. **Handshake**: The client establishes the WebSocket connection. The server transmits a 1-byte binary frame containing the byte `0x04` (protocol version 4).
    2. **Authentication**: The client sends a binary frame with `{"Auth": "<jwt_token>"}`. The server validates the token and replies with `"Authorized"`.
    3. **Snapshot Request**: The client requests a recording snapshot by sending `"RecordingSnapshotRequest"`.
    4. **Authorization & Response**:
       - The server evaluates token revocation and live effective permissions. If the user lacks `recording.read`, or if DVR is disabled, the server returns `{"RecordingWsError": {"code": "recording_forbidden"}}` or `{"RecordingWsError": {"code": "recording_disabled"}}`.
       - If authorized, the server returns an initial snapshot response `{"RecordingSnapshotResponse": {"revision": 12, "available": true, "quota": { ... }, "tasks": [ ... ]}}`.
    5. **Live Updates**: While connected, the server pushes updated `RecordingSnapshotResponse` frames whenever a recording changes or throttled progress updates fire.

    For full WebSocket message schemas and sequence diagrams, refer to `docs/src/player-api.md`.

    ---

    ## Diagnostic Response Headers & CORS

    When stream admission fails, capacity is exhausted, or a stream is preempted, Tuliprox serves a
    fallback response (or fallback video slate) carrying diagnostic headers:
    - `X-Tuliprox-Fallback`: Contains the exact rejection reason (e.g. `channel_unavailable`, `user_connections_exhausted`, `provider_connections_exhausted`, `low_priority_preempted`, `user_account_expired`, `provisioning`, `hls_session_or_lease_expired`, `maintenance`).
    - `X-Tuliprox-Rejection`: Present with value `admission_rejected` when admission is denied without video.
    - `Cache-Control: no-store`: Prevents intermediate caches and players from caching transient rejection responses.
    - **CORS**: `Access-Control-Expose-Headers: X-Tuliprox-Fallback, X-Tuliprox-Rejection` is set on all CORS-enabled responses.

servers:
  - url: "{baseUrl}{web_ui_path}"
    description: Tuliprox Server
    variables:
      baseUrl:
        default: http://localhost:8901
        description: Protocol, hostname, and port of the Tuliprox instance.
      web_ui_path:
        default: ""
        description: Optional Web UI URL prefix (e.g. `/tuli`). Leave empty if mounted at the root.

security:
  - bearerAuth: []

tags:
  - name: Authentication
    description: Playlist user credential verification, Bearer JWT issuance, and token refresh.
  - name: Player API
    description: "Personalized playback inspection, failover switching, joinable streams, and filtered playlist channels. Requires the effective Player API switches (`web_ui.player_api_enabled`, unset follows `user_ui_enabled`; `player_features.api_enabled`, unset follows `ui_enabled`)."
  - name: User Playlist
    description: User bouquet selection and playlist categories.
  - name: Recordings
    description: DVR preflight checks, recording requests, conflict preview, and task management.
  - name: Recording Media
    description: HTTP Range media playback, downloads, and thumbnail endpoints.
  - name: Playback
    description: Standard plain HTTP GET stream URLs for Xtream Codes and M3U media streaming.

paths:
  /ws:
    get:
      tags:
        - Recordings
      operationId: getWebSocketSnapshot
      summary: WebSocket connection for recording snapshots and live updates
      description: |
        WebSocket connection delivering live recording snapshots (`RecordingSnapshotResponse`).
        After the protocol version handshake (`4`) and authentication (`{"Auth": "<jwt>"}`), the client
        requests a snapshot with `"RecordingSnapshotRequest"`.
      responses:
        '200':
          description: Recording snapshot response frame (`RecordingSnapshotResponse`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingSnapshotResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /auth/token:
    post:
      tags:
        - Authentication
      operationId: authenticate
      summary: Authenticate playlist user or web user
      description: |
        Authenticates a playlist user against `api_proxy.yml` credentials (or a web user against `web_ui.auth`)
        and issues a signed JWT Bearer token.

        **Requirements & Semantics**:
        - `web_ui.auth.enabled` must be true.
        - For playlist users: either `ui_enabled` must be true (Web UI access) or the effective
          `player_features.api_enabled` must be true (Player API access). If neither Web UI nor Player API access
          is permitted, the server returns `403 Forbidden`. Global switches (`user_ui_enabled` and `player_api_enabled`)
          are checked per route, not at sign-in.
        - If credentials are invalid or unknown, returns `401 Unauthorized`.
        - If sign-in attempts exceed the rate limit, returns `429 Too Many Requests` with a `Retry-After` header.
        - The token subject is `api:<username>`. Effective permissions are evaluated dynamically from the live
          configuration on every subsequent request.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCredential'
            example:
              username: alice
              password: secretpassword
      responses:
        '200':
          description: Authentication successful. Returns signed JWT Bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              example:
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJhcGk6YWxpY2UiLCJ1c2VybmFtZSI6ImFsaWNlIn0.example
                username: alice
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'

  /auth/refresh:
    post:
      tags:
        - Authentication
      operationId: refreshToken
      summary: Refresh JWT token
      description: |
        Refreshes an active JWT Bearer token. The caller sends their current token in the `Authorization: Bearer <token>`
        header. Revoked tokens are rejected with `401 Unauthorized`. If neither `ui_enabled` nor effective
        `player_features.api_enabled` is true since issuance, returns `403 Forbidden`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Token refreshed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              example:
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJhcGk6YWxpY2UiLCJ1c2VybmFtZSI6ImFsaWNlIn0.refreshed
                username: alice
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/v1/me/capabilities:
    get:
      tags:
        - Player API
      operationId: getMeCapabilities
      summary: Query effective capabilities and limits
      description: |
        Discovers the effective capabilities, feature flags, connection limits, and active connection counts
        of the authenticated playlist user. Permissions and player features reflect the live configuration
        immediately.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Effective player capabilities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerCapabilitiesDto'
              example:
                source_switch: true
                joinable_streams: true
                recording: private
                recording_quota_bytes: 21474836480
                max_concurrent_recordings: 1
                max_recording_rules: 10
                free_shared_joins: true
                max_free_shared_joins: 1
                watch_progress: true
                event_stream: true
                stream_split: true
                effective_permissions:
                  - recording.read
                  - recording.create
                  - recording.manage
                  - recording.delete
                max_connections: 2
                active_connections: 1
                shared_joins: 0
                free_shared_joins_in_use: 0
                share_live_streams: true
                source_switch_protocols:
                  - ts
                  - hls
                recording_enabled: true
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/v1/me/channels:
    get:
      tags:
        - Player API
      operationId: getMeChannels
      summary: Search visible live TV channels
      description: |
        Lists live TV channels in the caller's target playlist that pass their content filter.
        Results can be filtered by query text and channel group.
      security:
        - bearerAuth: []
      parameters:
        - name: query
          in: query
          required: false
          description: Search term matched against channel name, title, or group.
          schema:
            type: string
          example: Sports
        - name: group
          in: query
          required: false
          description: Filter channels by exact category/group name.
          schema:
            type: string
          example: UK Sports
        - name: limit
          in: query
          required: false
          description: Maximum number of channels to return (clamped between 1 and 500, default 50).
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 500
          example: 20
      responses:
        '200':
          description: List of visible channels matching filter.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserChannelDto'
              example:
                - virtual_id: 1001
                  name: Sports 1 HD
                  group: Sports
                  epg_channel_id: sports1.example.com
                  is_group: true
                - virtual_id: 1002
                  name: Sports 2 FHD
                  group: Sports
                  epg_channel_id: sports2.example.com
                  is_group: false
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/v1/me/epg:
    get:
      tags:
        - Player API
      operationId: getMeEpg
      summary: Query EPG programme listings for a channel
      description: |
        Fetches EPG programme listings for one visible live channel by virtual ID (`vid`) within a `[from, to]`
        time window (maximum 48 hours). The caller's configured EPG timeshift offset is applied to programme times.
      security:
        - bearerAuth: []
      parameters:
        - name: vid
          in: query
          required: true
          description: Virtual ID of the channel.
          schema:
            type: integer
          example: 1001
        - name: from
          in: query
          required: false
          description: Start of query window as Unix timestamp seconds or RFC 3339 string (defaults to now).
          schema:
            type: string
          example: "1740045600"
        - name: to
          in: query
          required: false
          description: End of query window as Unix timestamp seconds or RFC 3339 string (maximum 48 hours after `from`).
          schema:
            type: string
          example: "1740052800"
      responses:
        '200':
          description: List of EPG programmes for the channel.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserProgrammeDto'
              example:
                - start: "2026-11-20T20:00:00Z"
                  start_ts: 1740045600
                  stop: "2026-11-20T22:00:00Z"
                  stop_ts: 1740052800
                  title: Premier League Live
                  desc: Match coverage and post-game analysis.
                  categories:
                    - Sports
                    - Football
                  is_live: true
                  is_new: true
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/me/streams:
    get:
      tags:
        - Player API
      operationId: getMeStreams
      summary: List active playback streams of caller
      description: |
        Lists all active playback streams owned by the authenticated playlist user across all client devices.
        Returns stream metadata, protocol, started timestamp, and member source index if running in a failover group.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of active streams.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserStreamDto'
              example:
                - uid: 104
                  virtual_id: 1001
                  group_virtual_id: 1001
                  member_vid: 2001
                  title: Sports 1 HD
                  item_type: Live
                  protocol: ts
                  shared: false
                  session_active: true
                  started_at: 1740045000
                  user_agent: TiviMate/4.7.0
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/v1/me/streams/{uid}:
    delete:
      tags:
        - Player API
      operationId: deleteMeStream
      summary: Terminate an own active stream
      description: |
        Terminates an active playback stream belonging to the caller and immediately frees their user connection slot.
        If `uid` does not exist or belongs to another user, returns `404 Not Found`. With
        `player_features.event_stream: true` the caller's event socket receives `stream_ended` with reason `stopped`.
      security:
        - bearerAuth: []
      parameters:
        - name: uid
          in: path
          required: true
          description: Unique stream identifier.
          schema:
            type: integer
          example: 104
      responses:
        '204':
          description: Stream terminated and connection slot released.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/me/streams/joinable:
    get:
      tags:
        - Player API
      operationId: getMeStreamsJoinable
      summary: List joinable running shared streams
      description: |
        Lists active shared streams that can be watched without consuming an additional upstream provider
        connection.

        The list contains streams of the caller's own target and compatible single-source streams of **other**
        targets. A foreign stream is listed only when the caller's target publishes the same provider item (same
        input and upstream URL), the caller's target shares the protocol, and the caller's content and item-type
        filters accept the caller-target item. Group streams of foreign targets are never listed, because their
        group keys are target-scoped. All returned fields (`virtual_id`, `title`, `logo`, `category`) belong to the
        caller's target.

        **Requirements**:
        - Requires `player_features.joinable_streams: true`. If disabled, returns `403 Forbidden` (`feature_disabled`).
        - Redacts usernames, IP addresses, viewer counts, and foreign target identities.
        - `requires_free_slot: true` indicates that the caller has exhausted their personal `max_connections` limit
          and free shared joins are not permitted.
      security:
        - bearerAuth: []
      x-required-feature: joinable_streams
      responses:
        '200':
          description: List of joinable shared streams.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JoinableStreamDto'
              example:
                - virtual_id: 1001
                  title: Sky Sports Main Event HD
                  logo: http://example.com/logo.png
                  category: UK Sports
                  protocol: ts
                  requires_free_slot: false
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/v1/me/streams/{uid}/failover-members:
    get:
      tags:
        - Player API
      operationId: getMeStreamFailoverMembers
      summary: Query failover members for an active stream
      description: |
        Returns the redacted failover group member list for an active playback stream owned by the caller.
        `current: true` indicates the member currently being streamed.

        Each member carries an optional `health` object detailing its operational state
        (`ok`, `degraded`, `failing`), probe media metrics (resolution tier, video codec, bitrate), rolling QoS
        scores (24h, 7d), and circuit breaker retry countdown when failing. QoS scores (rolling scores and failure streak)
        survive a server restart and are restored from storage on startup. In contrast, probe media metrics and circuit
        breaker state are maintained in memory only and reset on server restart.

        **Requirements**:
        - Requires `player_features.source_switch: true`. If disabled, returns `403 Forbidden` (`feature_disabled`).
        - Redacted: Contains no provider IDs, upstream input names, or internal stream credentials.
      security:
        - bearerAuth: []
      x-required-feature: source_switch
      parameters:
        - name: uid
          in: path
          required: true
          description: Unique stream identifier.
          schema:
            type: integer
          example: 104
      responses:
        '200':
          description: Redacted failover members of the running stream.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserFailoverMembersDto'
              example:
                group_name: Sports 1
                current_member_vid: 2001
                members:
                  - member_vid: 2001
                    index: 0
                    title: Sports 1 HD (1080p Main)
                    has_archive: true
                    current: true
                    health:
                      state: ok
                      resolution: P1080
                      video_codec: H264
                      bitrate_kbps: 5500
                      qos_24h: 92
                      qos_7d: 88
                  - member_vid: 2002
                    index: 1
                    title: Sports 1 HD (720p Backup)
                    has_archive: false
                    current: false
                    health:
                      state: ok
        '400':
          description: Stream is not a failover group stream or not a live stream (`not a failover group stream` or `manual switch only supported for live streams`).
          content:
            text/plain:
              schema:
                type: string
              example: not a failover group stream
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Stream not found or foreign stream (`stream not found` or `target not found`).
          content:
            text/plain:
              schema:
                type: string
              example: stream not found

  /api/v1/me/streams/{uid}/failover-switch:
    post:
      tags:
        - Player API
      operationId: postMeStreamFailoverSwitch
      summary: Switch source member on an active failover stream
      description: |
        Manually switches an active MPEG-TS or live HLS failover stream to another member source.

        **Rules & Error Codes**:
        - Requires `player_features.source_switch: true`. If disabled, returns `403 Forbidden` (`feature_disabled`).
        - Shared streams with multiple viewers cannot be switched exclusively (`409 Conflict`, `shared_stream_switch_refused`).
        - Paralleled switch in progress returns `409 Conflict` (`switch_in_progress`).
        - Switches within the 2-second cooldown period return `429 Too Many Requests` (`switch_cooldown`) with a `Retry-After` header.
        - Returns `200 OK` only after the switch has completed and the new binding is published.
      security:
        - bearerAuth: []
      x-required-feature: source_switch
      parameters:
        - name: uid
          in: path
          required: true
          description: Unique stream identifier.
          schema:
            type: integer
          example: 104
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StreamFailoverSwitchRequest'
            example:
              member_vid: 2002
      responses:
        '200':
          description: Source member switched successfully.
        '400':
          description: Member not in failover group (`member not in group`).
          content:
            text/plain:
              schema:
                type: string
              example: member not in group
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          description: Switch conflict (`switch_in_progress` or `shared_stream_switch_refused`).
          content:
            text/plain:
              schema:
                type: string
              example: shared_stream_switch_refused
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
        '502':
          $ref: '#/components/responses/BadGatewayError'

  /api/v1/me/channels/{vid}/failover-members:
    get:
      tags:
        - Player API
      operationId: getMeChannelFailoverMembers
      summary: Query failover members for a channel before playback
      description: |
        Returns the redacted failover group member list for a channel virtual ID before playback starts.
        The channel is checked against the caller's target and content filter. If the group channel is hidden
        by content filters, returns `404 Not Found`.

        Each member carries an optional `health` object detailing its operational state
        (`ok`, `degraded`, `failing`), probe media metrics (resolution tier, video codec, bitrate), rolling QoS
        scores (24h, 7d), and circuit breaker retry countdown when failing. QoS scores (rolling scores and failure streak)
        survive a server restart and are restored from storage on startup. In contrast, probe media metrics and circuit
        breaker state are maintained in memory only and reset on server restart.

        **Requirements**:
        - Requires `player_features.source_switch: true`. If disabled, returns `403 Forbidden` (`feature_disabled`).
      security:
        - bearerAuth: []
      x-required-feature: source_switch
      parameters:
        - name: vid
          in: path
          required: true
          description: Virtual ID of the group channel.
          schema:
            type: integer
          example: 1001
      responses:
        '200':
          description: Redacted failover members of the channel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserFailoverMembersDto'
              example:
                group_name: Sports 1
                members:
                  - member_vid: 2001
                    index: 0
                    title: Sports 1 HD (1080p Main)
                    has_archive: true
                    current: false
                    health:
                      state: ok
                      resolution: P1080
                      video_codec: H264
                      bitrate_kbps: 5500
                      qos_24h: 92
                      qos_7d: 88
                  - member_vid: 2002
                    index: 1
                    title: Sports 1 HD (720p Backup)
                    has_archive: false
                    current: false
                    health:
                      state: ok
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Channel virtual ID not found, not a failover group, or hidden by content filter (empty body).

  /api/v1/me/streams/{uid}/split:
    post:
      tags:
        - Player API
      operationId: postMeStreamSplit
      summary: Split an own shared stream into a dedicated connection
      description: |
        Splits an active shared live MPEG-TS stream of the caller off into a dedicated provider connection.
        The server reserves nothing; the response contains the URL the client must open **after** closing
        the current playback connection. Existing admission rules decide whether the new connection is accepted.

        **Requirements**:
        - Requires `player_features.source_switch: true`. If disabled, returns `403 Forbidden` (`feature_disabled`).
        - The stream must belong to the caller (`404 Not Found` otherwise).
        - Live MPEG-TS only: catch-up (timeshift), VOD, series, HLS, and DASH return `409 Conflict`
          (`split_unsupported_protocol`).
        - The stream must be shared and have more than one viewer (`409 Conflict`, `stream_not_shared`).
        - The two-second per-stream split cooldown applies (`429 Too Many Requests`, `switch_cooldown`); a failover
          member switch within two seconds after a split is refused the same way.

        The returned `url` is server-relative. It is `/live/<user>/<pass>/<vid>.ts?dedicated=1` for a target with an
        Xtream output and `/m3u-stream/live/<user>/<pass>/<vid>.ts?dedicated=1` otherwise. Its `dedicated=1` marker is
        honoured only for users with `source_switch`; for other users playback joins or registers the shared stream as
        usual.
      security:
        - bearerAuth: []
      x-required-feature: source_switch
      parameters:
        - name: uid
          in: path
          required: true
          description: Unique stream identifier from `GET /api/v1/me/streams`.
          schema:
            type: integer
          example: 104
      responses:
        '200':
          description: Split prepared; reconnect with the returned URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SplitStreamResponse'
              example:
                reconnect_required: true
                url: /live/alice/example-password/1042.ts?dedicated=1
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Stream not found or owned by another user.
          content:
            text/plain:
              schema:
                type: string
              example: stream not found
        '409':
          description: The stream cannot be split in its current state.
          content:
            text/plain:
              schema:
                type: string
                enum:
                  - split_unsupported_protocol
                  - stream_not_shared
              example: stream_not_shared
        '429':
          $ref: '#/components/responses/TooManyRequestsError'

  /api/v1/me/events:
    get:
      tags:
        - Player API
      operationId: getMeEvents
      summary: Personal player event stream (WebSocket)
      description: |
        Upgrades to a WebSocket that delivers JSON **text** frames with player events of the caller.
        This is not the binary `/ws` recording protocol.

        **Authentication**: send `Authorization: Bearer <token>` on the upgrade, or omit the header and
        send `{"type":"auth","token":"<token>"}` as the first text frame within 5 seconds. Tokens in
        the query string are not accepted.

        **First frame**: `{"type":"connected","server_time":<unix-seconds>}`.

        **Event frames**:
        - `{"type":"stream_ended","uid":104,"virtual_id":1042,"reason":"kicked"}` (`kicked`, `preempted`, or `stopped`)
        - `{"type":"failover_member_switched","group_virtual_id":9001,"from_member_vid":2001,"to_member_vid":2002}` (requires `source_switch`)
        - `{"type":"recording_finished","id":"<recording-id>","state":"completed"}` (`completed` or `failed`; requires recording level `read` or higher)
        - `{"type":"connection_denied","max_connections":2}`
        - `{"type":"resync_required"}` when the client fell behind; refetch REST state
        - `{"type":"error","code":"unauthorized"}` before a policy close

        The server sends a WebSocket Ping every 30 seconds and closes a socket with code `1008` when the
        user loses `event_stream`, loses the account, or exceeds the per-user socket limit.

        **Requirements**:
        - Requires `player_features.event_stream: true`; otherwise the upgrade answers `403` or the
          in-band auth answers `{"type":"error","code":"feature_disabled"}`.
        - At most four concurrent sockets per user; the fifth upgrade answers `429`.
      security:
        - bearerAuth: []
        - {}
      x-required-feature: event_stream
      responses:
        '2XX':
          description: |
            Successful protocol switch. The concrete status is `101 Switching Protocols`; the frames that
            follow are described in the `101` response.
        '101':
          description: |
            Switching Protocols. All application frames are JSON text frames as described above.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerEvent'
              examples:
                connected:
                  value:
                    type: connected
                    server_time: 1763678400
                streamEnded:
                  value:
                    type: stream_ended
                    uid: 104
                    virtual_id: 1042
                    reason: kicked
                recordingFinished:
                  value:
                    type: recording_finished
                    id: 3f6a1e0c-7d3a-4b5e-9c1e-0a2b6c8d9e10
                    state: completed
                resyncRequired:
                  value:
                    type: resync_required
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'

  /api/v1/me/progress:
    get:
      tags:
        - Player API
      operationId: getMeProgressList
      summary: List the caller's watch progress
      description: |
        Returns watch progress entries of the caller, newest first.

        **Requirements**:
        - Requires `player_features.watch_progress: true`. If disabled, returns `403 Forbidden` (`feature_disabled`).
      security:
        - bearerAuth: []
      x-required-feature: watch_progress
      parameters:
        - name: kind
          in: query
          required: false
          description: Filter by media kind.
          schema:
            $ref: '#/components/schemas/WatchProgressKind'
        - name: watched
          in: query
          required: false
          description: Filter by watched state.
          schema:
            type: boolean
        - name: limit
          in: query
          required: false
          description: Maximum number of entries. Default `50`, clamped to `1..=200`.
          schema:
            type: integer
            minimum: 1
            maximum: 200
          example: 50
      responses:
        '200':
          description: Watch progress entries, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WatchProgressEntry'
              example:
                - kind: episode
                  item_id: 4711
                  position_secs: 1500
                  duration_secs: 3000
                  watched: false
                  series_id: 88
                  updated_at: 1763678400
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
    delete:
      tags:
        - Player API
      operationId: deleteMeProgressAll
      summary: Delete all watch progress of the caller
      description: |
        Removes every watch progress entry of the caller.

        **Requirements**:
        - Requires `player_features.watch_progress: true`. If disabled, returns `403 Forbidden` (`feature_disabled`).
      security:
        - bearerAuth: []
      x-required-feature: watch_progress
      responses:
        '204':
          description: Progress deleted (also when no entry existed).
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/v1/me/progress/{kind}/{item_id}:
    parameters:
      - name: kind
        in: path
        required: true
        description: Media kind.
        schema:
          $ref: '#/components/schemas/WatchProgressKind'
      - name: item_id
        in: path
        required: true
        description: Xtream stream id the player plays; must be greater than `0`.
        schema:
          type: integer
          minimum: 1
        example: 4711
    get:
      tags:
        - Player API
      operationId: getMeProgressOne
      summary: Read one watch progress entry
      description: |
        Returns a single watch progress entry of the caller. Unknown entries answer `404` with an empty body.

        **Requirements**:
        - Requires `player_features.watch_progress: true`. If disabled, returns `403 Forbidden` (`feature_disabled`).
      security:
        - bearerAuth: []
      x-required-feature: watch_progress
      responses:
        '200':
          description: The watch progress entry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WatchProgressEntry'
              example:
                kind: movie
                item_id: 42
                position_secs: 150
                duration_secs: 300
                watched: false
                updated_at: 1763678400
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    put:
      tags:
        - Player API
      operationId: putMeProgress
      summary: Create or update one watch progress entry
      description: |
        Stores the playback position of one item. Omitted `duration_secs` and `series_id` keep the stored values.
        `watched` is derived when omitted: an item becomes watched at 90 % of `duration_secs`; otherwise an already
        watched item stays watched while `position_secs >= 60` and drops back below 60 seconds. An explicit `watched`
        wins. If the user was deleted while the request was being processed, the answer is `401`.

        **Requirements**:
        - Requires `player_features.watch_progress: true`. If disabled, returns `403 Forbidden` (`feature_disabled`).
      security:
        - bearerAuth: []
      x-required-feature: watch_progress
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WatchProgressUpdate'
            example:
              position_secs: 1500
              duration_secs: 3000
              series_id: 88
      responses:
        '204':
          description: Progress stored.
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '413':
          description: Request body exceeds the 4 KiB limit.
        '415':
          description: Missing or wrong `Content-Type`.
        '422':
          description: Well-formed JSON with invalid field values.
    delete:
      tags:
        - Player API
      operationId: deleteMeProgressOne
      summary: Delete one watch progress entry
      description: |
        Removes a single watch progress entry. Answers `204` also when it did not exist.

        **Requirements**:
        - Requires `player_features.watch_progress: true`. If disabled, returns `403 Forbidden` (`feature_disabled`).
      security:
        - bearerAuth: []
      x-required-feature: watch_progress
      responses:
        '204':
          description: Progress deleted.
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

