              pre_roll_secs: 180
              post_roll_secs: 600
      responses:
        '204':
          description: Recording request updated.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '501':
          $ref: '#/components/responses/RecordingDisabledError'
    delete:
      tags:
        - Recordings
      operationId: removeRecordingRequest
      summary: Remove a recording request
      description: |
        Removes a completed or failed recording request owned by the caller. If no other user's library entry
        references the physical recording materialization, the underlying file is deleted and disk quota reclaimed.
      security:
        - bearerAuth: []
      x-required-feature: recording (private or shared)
      parameters:
        - name: id
          in: path
          required: true
