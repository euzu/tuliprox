  /player_api.php:
    get:
      tags:
        - Playback
      security: []
      operationId: getXtreamPlayerApi
      summary: Xtream Codes API metadata and handshake
      description: |
        Emulates the Xtream Codes `player_api.php` protocol.
        Without an `action` parameter, returns user authentication and server info.
        With `action`, returns live streams, VOD streams, series, categories, VOD info, or EPG listings.

        **Recordings in Xtream VOD (Feature F2)**:
        - Prerequisites: Global DVR enabled (`video.recording.enabled: true`), API proxy user
          (`api_proxy.yml`), recording level `read`, `private`, or `shared`, `video` cluster permitted, and
          target has Xtream output. The `skip_vod` input flag does not hide recordings.
        - "Recordings category" collision: If the provider publishes a VOD category with ID `2000000000`, the provider
          wins in both `get_vod_categories` and `get_vod_streams` and no recordings are served.
        - Synthetic category `2000000000` (`Recordings`): Injected into `get_vod_categories` when no collision occurs.
        - `get_vod_streams?category_id=2000000000`: Fast path that returns only completed visible recordings
          without scanning the target playlist (unless provider defines category `2000000000`).
        - `get_vod_streams` without `category_id`: Completed visible recordings are appended at the end of the VOD
          playlist (unless category `2000000000` collides with a provider category).
        - `get_vod_info`: Info lookup for `vod_id`. Playlist items always take precedence on collision; completed
          recordings are consulted only when no playlist item matches and `vod_id >= 1000000000`. For invisible or unknown
          recording IDs, `get_vod_info` answers the normal empty info. In the recording info response, `duration` is `HH:MM:SS`
          (e.g. `"01:00:00"`), `duration_secs` is the number of seconds as a string (e.g. `"3600"`), and `added` is the Unix time
          of the recording completion as a string (e.g. `"1700000000"`).
        - Completed recordings only: Only recordings with state `completed` are listed. A recording whose file was removed
          externally is still listed until the queue notices; playback then answers like an unknown ID. Scheduled, running,
          failed, or cancelled tasks are neither listed nor playable.
        - Stable stream IDs: Assigned sequentially starting at `1000000000`, persisted with the task, and never reused. Only IDs `>= 1000000000`
          are looked up as recordings.
        - Playback fallback, connection accounting & throttling: An invisible or unknown recording ID answers like any unknown
          movie ID (the normal fallback response, e.g. `X-Tuliprox-Fallback: channel_unavailable`), NOT a bare 404. Recording
          playback counts as one user connection like a library file against `max_connections`, but records no provider for
          the session (it plays from local storage) and consumes 0 provider connections. Playback is throttled like library
          files when throttling is configured.
      parameters:
        - name: username
          in: query
          required: true
          schema:
            type: string
          example: alice
        - name: password
          in: query
          required: true
          schema:
            type: string
          example: secretpassword
        - name: action
          in: query
          required: false
          description: Xtream action query parameter.
          schema:
            type: string
            enum:
              - get_account_info
              - get_live_categories
              - get_live_streams
              - get_vod_categories
              - get_vod_streams
              - get_series_categories
              - get_series
              - get_series_info
              - get_vod_info
              - get_epg
              - get_short_epg
              - get_simple_data_table
          example: get_live_categories
        - name: category_id
          in: query
          required: false
          description: Category ID to filter streams (e.g. `2000000000` for completed recordings).
          schema:
            type: string
          example: "2000000000"
        - name: vod_id
          in: query
          required: false
          description: VOD movie or completed recording stream ID for `get_vod_info`.
          schema:
            type: string
          example: "1000000000"
      responses:
        '200':
          description: JSON object or array matching requested Xtream Codes action.
          content:
            application/json:
              schema:
                type: object
              example:
                user_info:
                  username: alice
                  status: Active
                  auth: 1
                server_info:
                  url: localhost
                  port: 8901
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JSON Web Token (JWT) issued by `POST {web_ui_path}/auth/token`.
        Include in the HTTP request as `Authorization: Bearer <token>`.

  headers:
    X-Tuliprox-Fallback:
      description: |
        Diagnostic reason explaining why a fallback slate, terminal response, or rejection
        was returned instead of active upstream provider streaming.
      schema:
        type: string
        enum:
          - channel_unavailable
          - user_connections_exhausted
          - provider_connections_exhausted
          - low_priority_preempted
          - user_account_expired
          - provisioning
          - hls_session_or_lease_expired
          - maintenance
      example: provider_connections_exhausted

    X-Tuliprox-Rejection:
      description: |
        Set to `admission_rejected` when stream admission is denied without returning video
        (e.g. `custom_stream_response_enabled` is false).
      schema:
        type: string
        enum:
          - admission_rejected
      example: admission_rejected

    X-Token-Refresh:
      description: |
        Indicates that the token's permission schema version is obsolete and must be refreshed.
      schema:
        type: string
        enum:
          - required
      example: required

    Retry-After:
      description: |
        Minimum wait duration in seconds before retrying the request (e.g. on source switch cooldown or rate limit).
      schema:
        type: integer
        minimum: 1
      example: 2

  responses:
    UnauthorizedError:
      description: Authentication failed, token expired, or missing Bearer token.
      headers:
        WWW-Authenticate:
          schema:
            type: string
            example: Bearer
        X-Token-Refresh:
          $ref: '#/components/headers/X-Token-Refresh'

    ForbiddenError:
      description: "Access forbidden due to disabled Web UI access (`ui_enabled: false` or `user_ui_enabled: false`), disabled Player API access (`api_enabled: false` or `player_api_enabled: false`), or missing feature permissions."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: feature_disabled
        text/plain:
          schema:
            type: string
          example: feature_disabled

    BadRequestError:
      description: Invalid request parameters or malformed body.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: invalid_from_timestamp
        text/plain:
          schema:
            type: string
          example: invalid_from_timestamp

    NotFoundError:
      description: Requested stream, channel, or recording was not found or is not accessible.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: channel_not_found

    ConflictError:
      description: Action cannot be performed due to current resource state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: switch_in_progress
        text/plain:
          schema:
            type: string
          example: switch_in_progress

    TooManyRequestsError:
      description: Operation attempted within the mandatory cooldown window or rate limited.
      headers:
        Retry-After:
          $ref: '#/components/headers/Retry-After'
      content:
        text/plain:
          schema:
            type: string
          example: switch_cooldown

    RecordingDisabledError:
      description: "DVR subsystem is disabled on the server (`recording.enabled: false`)."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: recording_disabled

    BadGatewayError:
      description: Upstream provider or stream driver failure.
      headers:
        X-Tuliprox-Fallback:
          $ref: '#/components/headers/X-Tuliprox-Fallback'
        X-Tuliprox-Rejection:
          $ref: '#/components/headers/X-Tuliprox-Rejection'
        Cache-Control:
          schema:
            type: string
            example: no-store

    InternalServerError:
      description: Server error occurred during processing.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: internal_server_error

  schemas:
    UserCredential:
      type: object
      description: Playlist user or Web UI credentials for authentication.
      required:
        - username
        - password
      properties:
        username:
          type: string
          description: Username of the principal.
          example: alice
        password:
          type: string
          description: Password of the principal.
          format: password
          example: secretpassword

    TokenResponse:
      type: object
      description: JWT authentication token response.
      required:
        - token
        - username
      properties:
        token:
          type: string
          description: Signed JSON Web Token (JWT).
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJhcGk6YWxpY2UiLCJ1c2VybmFtZSI6ImFsaWNlIn0.example
        username:
          type: string
          description: Authenticated username.
          example: alice

    PlayerRecordingLevel:
      type: string
      description: Effective recording capability tier assigned to the user or plan.
      enum:
        - none
        - read
        - private
        - shared
      example: private

    PlayerCapabilitiesDto:
      type: object
      description: Effective capabilities, features, and active limits of the playlist user.
      required:
        - source_switch
        - joinable_streams
        - recording
        - free_shared_joins
        - max_free_shared_joins
        - watch_progress
        - event_stream
        - stream_split
        - effective_permissions
        - max_connections
        - active_connections
        - shared_joins
        - free_shared_joins_in_use
        - share_live_streams
        - source_switch_protocols
        - recording_enabled
      properties:
        source_switch:
          type: boolean
          description: Whether failover source member inspection and manual switching are permitted.
          example: true
        joinable_streams:
          type: boolean
          description: Whether discovering running shared streams is permitted.
          example: true
        recording:
          $ref: '#/components/schemas/PlayerRecordingLevel'
        recording_quota_bytes:
          type: integer
          format: int64
          description: Personal recording quota in bytes (omitted when unset).
          example: 21474836480
        max_concurrent_recordings:
          type: integer
          description: Maximum concurrent recordings permitted (omitted when unset).
          example: 1
        max_recording_rules:
          type: integer
          description: Maximum active recording rules permitted (omitted when recording is none or read).
          example: 10
        free_shared_joins:
          type: boolean
          description: Whether the user may join shared streams beyond their connection limit.
          example: true
        max_free_shared_joins:
          type: integer
          description: Maximum simultaneous free shared stream joins.
          example: 1
        watch_progress:
          type: boolean
          description: Whether playback progress tracking and retrieval are permitted.
          example: true
        event_stream:
          type: boolean
          description: Whether real-time user event stream WebSocket is permitted.
          example: true
        stream_split:
          type: boolean
          description: Whether stream splitting is permitted (mirrors source_switch).
          example: true
        effective_permissions:
          type: array
          description: List of effective permission names currently held by the caller.
          items:
            type: string
          example:
            - recording.read
            - recording.create
            - recording.manage
            - recording.delete
        max_connections:
          type: integer
          description: Maximum concurrent playback connections permitted.
          example: 2
        active_connections:
          type: integer
          description: Count of current active playback connections.
          example: 1
        shared_joins:
          type: integer
          description: Count of active connections that are joining existing shared streams.
          example: 0
        free_shared_joins_in_use:
          type: integer
          description: Count of free shared joins currently consumed.
          example: 0
        share_live_streams:
          type: boolean
          description: Whether live stream sharing is enabled on the caller's target.
          example: true
        source_switch_protocols:
          type: array
          description: Supported protocols for source member switching.
          items:
            type: string
          example:
            - ts
            - hls
        recording_enabled:
          type: boolean
          description: Whether the DVR subsystem is globally enabled on the server.
          example: true

    SplitStreamResponse:
      type: object
      description: Reconnect instruction returned by `POST /api/v1/me/streams/{uid}/split`.
      required:
        - reconnect_required
        - url
      properties:
        reconnect_required:
          type: boolean
          description: Always `true`; the client must close the old stream and open `url`.
          example: true
        url:
          type: string
          description: |
            Server-relative playback URL carrying the `dedicated=1` marker. The Xtream form is
            `/live/<user>/<pass>/<vid>.ts?dedicated=1`; a target without an Xtream output uses
            `/m3u-stream/live/<user>/<pass>/<vid>.ts?dedicated=1`. Prepend `scheme://host:port`; playback routes do not
            use `web_ui_path`.
          example: /live/alice/example-password/1042.ts?dedicated=1

    WatchProgressKind:
      type: string
      description: Media kind tracked by the watch progress API.
      enum:
        - movie
        - episode
        - recording
      example: episode

    WatchProgressUpdate:
      type: object
      description: Playback position to store for one item.
      required:
        - position_secs
      properties:
        position_secs:
          type: integer
          format: int64
          minimum: 0
          description: Current playback position in seconds.
          example: 1500
        duration_secs:
          type: integer
          format: int64
          minimum: 0
          description: Total duration in seconds; enables the automatic `watched` calculation.
          example: 3000
        watched:
          type: boolean
          description: Explicit watched flag; wins over the automatic calculation.
          example: false
        series_id:
          type: integer
          description: Series id supplied by the client so episodes can be grouped.
          example: 88

    WatchProgressEntry:
      type: object
      description: Stored watch progress of one media item.
      required:
        - kind
        - item_id
        - position_secs
        - watched
        - updated_at
      properties:
        kind:
          $ref: '#/components/schemas/WatchProgressKind'
        item_id:
          type: integer
          description: Xtream stream id the player plays (movie id, episode id, or recording `vod_id`).
          example: 4711
        position_secs:
          type: integer
          format: int64
          description: Last stored playback position in seconds.
          example: 1500
        duration_secs:
          type: integer
          format: int64
          description: Total duration in seconds (omitted when unknown).
          example: 3000
        watched:
          type: boolean
          description: Effective watched state.
          example: false
        series_id:
          type: integer
          description: Series id supplied by the client (omitted when unset).
          example: 88
        updated_at:
          type: integer
          format: int64
          description: Server timestamp of the last write in Unix seconds.
          example: 1763678400

    PlayerEvent:
      type: object
      description: |
        One JSON text frame of the `/api/v1/me/events` WebSocket. The `type` field selects the variant;
        fields not belonging to the variant are absent.
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - connected
            - stream_ended
            - failover_member_switched
            - recording_finished
            - connection_denied
            - resync_required
            - error
          description: Event discriminator.
          example: stream_ended
        server_time:
          type: integer
          format: int64
          description: Server time in Unix seconds (`connected` only).
          example: 1763678400
        uid:
          type: integer
          description: Stream uid that ended (`stream_ended` only).
          example: 104
        virtual_id:
          type: integer
          description: Channel virtual id of the ended stream (`stream_ended` only).
          example: 1042
        reason:
          type: string
          enum:
            - kicked
            - preempted
            - stopped
          description: |
            Why the stream ended (`stream_ended` only): `kicked` (replaced by another device), `preempted` (higher
            priority or capacity), or `stopped` (the caller ended it with `DELETE /api/v1/me/streams/{uid}`).
          example: kicked
        group_virtual_id:
          type: integer
          description: Failover group virtual id (`failover_member_switched` only).
          example: 9001
        from_member_vid:
          type: integer
          description: Previous member virtual id (`failover_member_switched` only).
          example: 2001
        to_member_vid:
          type: integer
          description: New member virtual id (`failover_member_switched` only).
          example: 2002
        id:
          type: string
          description: Recording request id (`recording_finished` only).
          example: 3f6a1e0c-7d3a-4b5e-9c1e-0a2b6c8d9e10
        state:
          type: string
          enum:
            - completed
            - failed
          description: Terminal recording state (`recording_finished` only).
          example: completed
        max_connections:
          type: integer
          description: Connection limit that refused the attempt (`connection_denied` only).
          example: 2
        code:
          type: string
          description: Stable error code (`error` only), for example `unauthorized`, `feature_disabled`,
            or `too_many_connections`.
          example: unauthorized

    UserChannelDto:
      type: object
      description: Live TV channel visible to the authenticated player user.
      required:
        - virtual_id
        - name
        - group
        - is_group
      properties:
        virtual_id:
          type: integer
          description: Virtual channel ID.
          example: 1001
        name:
          type: string
          description: Display name of the channel.
          example: Sports 1 HD
        group:
          type: string
          description: Category or playlist group name.
          example: Sports
        epg_channel_id:
          type: string
          description: EPG mapping identifier if assigned (omitted when unknown).
          example: sports1.example.com
        is_group:
          type: boolean
          description: Whether this channel is a multi-source failover group.
          example: true

    UserProgrammeDto:
      type: object
      description: EPG programme entry for a live channel with user timeshift applied.
      required:
        - start
        - start_ts
        - stop
        - stop_ts
        - title
        - categories
        - is_live
        - is_new
      properties:
        start:
          type: string
          description: Scheduled start time as an ISO 8601 string with timeshift offset.
          example: "2026-11-20T20:00:00Z"
        start_ts:
          type: integer
          format: int64
          description: Scheduled start time as Unix timestamp seconds.
          example: 1740045600
        stop:
          type: string
          description: Scheduled end time as an ISO 8601 string with timeshift offset.
          example: "2026-11-20T22:00:00Z"
        stop_ts:
          type: integer
          format: int64
          description: Scheduled end time as Unix timestamp seconds.
          example: 1740052800
        title:
          type: string
          description: Programme title.
          example: Premier League Live
        desc:
          type: string
          description: Programme description or synopsis (omitted when unknown).
          example: Live match coverage and post-match studio discussion.
        categories:
          type: array
          description: Genre or category classifications.
          items:
            type: string
          example:
            - Sports
            - Football
        is_live:
          type: boolean
          description: Whether the broadcast is a live event.
          example: true
        is_new:
          type: boolean
          description: Whether the broadcast is a new premiere episode.
          example: true

    PlaylistItemType:
      type: string
      description: Classification of playlist media item.
      enum:
        - Live
        - Video
        - Series
        - SeriesInfo
        - Catchup
        - LiveUnknown
        - LiveHls
        - LiveDash
        - LocalVideo
        - LocalSeries
        - LocalSeriesInfo
      example: Live

    UserStreamDto:
      type: object
      description: Summary of an active playback stream owned by the caller.
      required:
        - uid
        - virtual_id
        - title
        - item_type
        - protocol
        - shared
        - session_active
        - started_at
        - user_agent
      properties:
        uid:
          type: integer
          description: Unique stream session identifier.
          example: 104
        virtual_id:
          type: integer
          description: Virtual channel ID.
          example: 1001
        group_virtual_id:
          type: integer
          description: Group virtual ID if running within a failover group (omitted when unknown).
          example: 1001
        member_vid:
          type: integer
          description: Current member source virtual ID within the failover group (omitted when unknown).
          example: 2001
        title:
          type: string
          description: Channel or media title.
          example: Sports 1 HD
        item_type:
          $ref: '#/components/schemas/PlaylistItemType'
        protocol:
          type: string
          description: Playback protocol (`ts`, `hls`, or `dash`).
          example: ts
        shared:
          type: boolean
          description: Whether this stream is shared with other viewers on the server.
          example: false
        session_active:
          type: boolean
          description: Whether the stream connection is currently active.
          example: true
        started_at:
          type: integer
          format: int64
          description: Stream start time as Unix timestamp seconds.
          example: 1740045000
        user_agent:
          type: string
          description: User-Agent header sent by the client player.
          example: TiviMate/4.7.0
        session_token:
          type: string
          description: Session token identifier for HLS playback sessions (omitted when unknown).

    JoinableStreamDto:
      type: object
      description: Summary of a running shared stream available to join without extra upstream provider cost.
      required:
        - virtual_id
        - title
        - logo
        - category
        - protocol
        - requires_free_slot
      properties:
        virtual_id:
          type: integer
          description: Virtual ID of the channel.
          example: 1001
        title:
          type: string
          description: Channel title.
          example: Sports 1 HD
        logo:
          type: string
          description: Channel logo URL.
          example: http://example.com/logo.png
        category:
          type: string
          description: Category or playlist group name.
          example: Sports
        protocol:
          type: string
          description: Stream protocol (`ts` or `hls`).
          example: ts
        requires_free_slot:
          type: boolean
          description: True if caller has reached connection limits and needs to free a slot to join.
          example: false

    UserFailoverMemberDto:
      type: object
      description: Redacted failover source member information for player clients.
      required:
        - member_vid
        - index
        - title
        - has_archive
        - current
      properties:
        member_vid:
          type: integer
          description: Member virtual ID used to address or switch to this specific source.
          example: 2001
        index:
          type: integer
          description: Zero-based priority index in the failover group.
          example: 0
        title:
          type: string
          description: Member display title.
          example: Sports 1 HD (1080p Main)
        has_archive:
          type: boolean
          description: Whether this member source supports catchup/archive playback.
          example: true
        current:
          type: boolean
          description: Whether this member is the active playback source.
          example: true
        health:
          $ref: '#/components/schemas/UserMemberHealthDto'

    UserFailoverMembersDto:
      type: object
      description: Redacted failover group response containing available source members.
      required:
        - group_name
        - members
      properties:
        group_name:
          type: string
          description: Display name of the failover group.
          example: Sports 1
        current_member_vid:
          type: integer
          description: Virtual ID of the active member source (omitted when unknown).
          example: 2001
        members:
          type: array
          description: List of available member sources.
          items:
            $ref: '#/components/schemas/UserFailoverMemberDto'

    StreamFailoverSwitchRequest:
      type: object
      description: Request payload to switch an active failover stream to another member source.
      required:
        - member_vid
      properties:
        member_vid:
          type: integer
          description: Target member virtual ID to switch to.
          example: 2002

    UserMemberHealthState:
      type: string
      description: High-level health state of a failover member.
      enum:
        - ok
        - degraded
        - failing
      example: ok

    VideoResolution:
      type: string
      description: |
        Classified video resolution tier.
        Note that `Unknown` is omitted when unknown in health responses.
      enum:
        - Unknown
        - SD
        - P720
        - P1080
        - P1440
        - P2160
        - P4320
      example: P1080

    VideoCodec:
      type: string
      description: |
        Classified video codec.
        Note that `Other` is omitted when unknown in health responses.
      enum:
        - Other
        - H264
        - H265
        - MPEG4
        - VC1
        - AV1
      example: H264

    UserMemberHealthDto:
      type: object
      description: |
        Redacted health, quality, and probe information of a failover member for playlist users.
        QoS scores (rolling scores and failure streak) survive a server restart and are restored
        from storage on startup. In contrast, probe media metrics (resolution, video codec,
        bitrate) and circuit breaker state are maintained in memory only and reset on server restart.
      required:
        - state
      properties:
        state:
          $ref: '#/components/schemas/UserMemberHealthState'
        resolution:
          $ref: '#/components/schemas/VideoResolution'
        video_codec:
          $ref: '#/components/schemas/VideoCodec'
        bitrate_kbps:
          type: integer
          description: Video stream bitrate in kbps from media probe (omitted when unknown).
          example: 5500
        qos_24h:
          type: integer
          description: 24-hour rolling QoS score from 0 to 100 (omitted when unknown).
          example: 92
        qos_7d:
          type: integer
          description: 7-day rolling QoS score from 0 to 100 (omitted when unknown).
          example: 88
        retry_after_secs:
          type: integer
          format: int64
          description: Remaining circuit breaker backoff seconds before retry (present only when state is failing; omitted otherwise).
          example: 15

    PlaylistClusterCategoriesDto:
      type: object
      description: Categories available within an output format grouped by cluster.
      properties:
        live:
          type:
            - array
            - "null"
          items:
            type: string
          example:
            - UK Sports
            - UK Entertainment
        vod:
          type:
            - array
            - "null"
          items:
            type: string
          example:
            - Action Movies
        series:
          type:
            - array
            - "null"
          items:
            type: string
          example:
            - Comedy Series

    PlaylistCategoriesDto:
      type: object
      description: Available categories for Xtream and M3U playlists.
      properties:
        xtream:
          $ref: '#/components/schemas/PlaylistClusterCategoriesDto'
        m3u:
          $ref: '#/components/schemas/PlaylistClusterCategoriesDto'

    PlaylistClusterBouquetDto:
      type: object
      description: User bouquet selection for a cluster.
      properties:
        live:
          type:
            - array
            - "null"
          items:
            type: string
          example:
            - UK Sports
        vod:
          type:
            - array
            - "null"
          items:
            type: string
        series:
          type:
            - array
            - "null"
          items:
            type: string

    PlaylistBouquetDto:
      type: object
      description: User bouquet filter configuration.
      properties:
        xtream:
          $ref: '#/components/schemas/PlaylistClusterBouquetDto'
        m3u:
          $ref: '#/components/schemas/PlaylistClusterBouquetDto'

    XtreamCluster:
      type: string
      description: Stream cluster classification.
      enum:
        - Live
        - Video
        - Series
      example: Live

    UserRuleSource:
      type: object
      description: User-facing source identifiers of a recording rule. Provider internals are omitted.
      required:
        - target_id
        - virtual_id
        - is_group
      properties:
        target_id:
          type: string
          description: Resolved target name of the rule source.
          example: main
        virtual_id:
          type: string
          description: Playlist channel virtual id resolved by the server.
          example: "1042"
        is_group:
          type: boolean
          description: Whether the source resolves to a failover group.
          example: false

    RuleBody:
      description: |
        Matching body of a rule. Only `weekly_timeslot` can be created through the API; `new_episode`
        is parsed for stored rules but refused on create.
      oneOf:
        - type: object
          title: WeeklyTimeslot
          required:
            - kind
            - weekday
            - local_start_time
            - duration_secs
            - timezone
          properties:
            kind:
              type: string
              enum:
                - weekly_timeslot
            weekday:
              type: integer
              minimum: 1
              maximum: 7
              description: ISO 8601 weekday, `1` = Monday .. `7` = Sunday.
              example: 3
            local_start_time:
              type: string
              pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
              description: Local start time in 24-hour `HH:MM` form.
              example: "20:00"
            duration_secs:
              type: integer
              format: int64
              minimum: 1
              description: Recording length without padding.
              example: 3600
            timezone:
              type: string
              description: IANA timezone name.
              example: Europe/Berlin
          additionalProperties: false
        - type: object
          title: NewEpisode
          required:
            - kind
          properties:
            kind:
              type: string
              enum:
                - new_episode
            series_id:
              type: string
              description: Stable EPG series id.
            title_pattern:
              type: string
              description: Normalized title fallback when no series id exists.
            exclude_repeat:
              type: boolean
              description: Exclude programmes with explicit `Repeat` status. Defaults to `true`.
              default: true
          additionalProperties: false

    CreateRecordingRuleRequest:
      type: object
      description: Request body to create a recurring recording rule.
      required:
        - virtual_id
        - body
      properties:
        target_id:
          type: string
          description: Own target name or numeric id; defaults to the caller's target. The server stores the resolved name.
          example: main
        virtual_id:
          type: string
          description: Playlist channel virtual id, or an EPG channel id.
          example: "1042"
        input_name:
          type: string
          description: |
            Input name. For playlist users the server derives it from the playlist and ignores a client value; for Web
            UI users an empty value means the server resolves it from the playlist.
          default: ""
          example: ""
        body:
          $ref: '#/components/schemas/RuleBody'
        visibility:
          $ref: '#/components/schemas/RecordingVisibility'
        channel_id:
          type: string
          description: Stable EPG channel id used as matching fallback.
          example: sports1.example.com
        pre_roll_secs:
          type: integer
          format: int64
          maximum: 900
          description: Seconds recorded before the scheduled start.
          default: 0
          example: 0
        post_roll_secs:
          type: integer
          format: int64
          maximum: 1800
          description: Seconds recorded after the scheduled end.
          default: 0
          example: 60

    EditRecordingRuleRequest:
      type: object
      description: Patch body of a recording rule. Omitted fields stay unchanged.
      properties:
        body:
          $ref: '#/components/schemas/RuleBody'
        visibility:
          $ref: '#/components/schemas/RecordingVisibility'
        enabled:
          type: boolean
        channel_id:
          type: string
        clear_channel_id:
          type: boolean
          description: Remove the stored channel id (takes precedence over `channel_id`).
          default: false
        pre_roll_secs:
          type: integer
          format: int64
          maximum: 900
        post_roll_secs:
          type: integer
          format: int64
          maximum: 1800

    UserRecordingRuleResponse:
      type: object
      description: |
        Redacted recording rule returned to playlist users, together with the queue revision observed while it was
        read. Provider internals are omitted from `source`.
      required:
        - revision
        - id
        - own
        - visibility
        - enabled
        - source
        - body
        - pre_roll_secs
        - post_roll_secs
        - created_at
        - updated_at
      properties:
        revision:
          type: integer
          format: int64
          description: Queue revision observed while the list was assembled.
          example: 12
        id:
          type: string
          description: Stable rule id.
          example: rule-1763678400-ab12cd34
        owner_id:
          type: string
          description: Owner principal. Present only for the caller's own rules.
          example: api:alice
        own:
          type: boolean
          description: Whether the rule belongs to the caller.
          example: true
        visibility:
          $ref: '#/components/schemas/RecordingVisibility'
        enabled:
          type: boolean
          example: true
        source:
          $ref: '#/components/schemas/UserRuleSource'
        channel_id:
          type: string
          description: Stable EPG channel id used as matching fallback (omitted when unset).
          example: sports1.example.com
        body:
          $ref: '#/components/schemas/RuleBody'
        pre_roll_secs:
          type: integer
          format: int64
          example: 0
        post_roll_secs:
          type: integer
          format: int64
          example: 60
        created_at:
          type: integer
          format: int64
          description: Creation time in Unix seconds.
          example: 1763678400
        updated_at:
          type: integer
          format: int64
          description: Last update time in Unix seconds.
          example: 1763678400

    RecordingVisibility:
      type: string
      description: Visibility scope of a recording.
      enum:
        - private
        - shared
      example: private

    RecordingSourceRequest:
      type: object
      description: Source channel identifiers for recording.
      required:
        - target_id
        - virtual_id
        - cluster
        - input_name
      properties:
        target_id:
          type: string
          description: Target playlist identifier.
          example: main
        virtual_id:
          type: string
          description: Virtual channel or media ID.
          example: "1001"
        cluster:
          $ref: '#/components/schemas/XtreamCluster'
        input_name:
          type: string
          description: Upstream input source name.
          example: sat-feed-1

    EpgEpisodeMetadata:
      type: object
      description: EPG episode metadata for a recording.
      properties:
        programme_id:
          type:
            - string
            - "null"
          example: prog-12345
        series_id:
          type:
            - string
            - "null"
          example: series-6789
        episode_id:
          type:
            - string
            - "null"
          example: ep-01
        season:
          type:
            - integer
            - "null"
          example: 1
        episode:
          type:
            - integer
            - "null"
          example: 5
        airing:
          type: string
          enum:
            - unknown
            - new
            - repeat
          default: unknown
          example: new

    CreateRecordingRequest:
      type: object
      description: Payload for scheduling a recording.
      required:
        - source
        - program_title
        - visibility
      properties:
        source:
          $ref: '#/components/schemas/RecordingSourceRequest'
        program_title:
          type: string
          description: Title of the programme.
          example: FA Cup Quarter Final
        program_start:
          type: integer
          format: int64
          description: Scheduled start time as Unix timestamp seconds (required for Live, omitted for VOD/Series).
          example: 1740045600
        program_end:
          type: integer
          format: int64
          description: Scheduled end time as Unix timestamp seconds (required for Live, omitted for VOD/Series).
          example: 1740052800
        pre_roll_secs:
          type: integer
          description: Seconds to record before scheduled start time (omitted when unset).
          example: 120
        post_roll_secs:
          type: integer
          description: Seconds to record after scheduled end time (omitted when unset).
          example: 300
        visibility:
          $ref: '#/components/schemas/RecordingVisibility'
        channel_id:
          type: string
          description: EPG channel mapping identifier (omitted when unknown).
          example: sports1.example.com
        channel_name:
          type: string
          description: Display name of the channel (omitted when unknown).
          example: Sports 1 HD
        epg:
          $ref: '#/components/schemas/EpgEpisodeMetadata'

    EditRecordingTaskBody:
      type: object
      description: Modifiable attributes of a scheduled recording request (all fields optional).
      properties:
        program_start:
          type: integer
          format: int64
          example: 1740045600
        program_end:
          type: integer
          format: int64
          example: 1740052800
        pre_roll_secs:
          type: integer
          example: 180
        post_roll_secs:
          type: integer
          example: 600
        program_title:
          type: string
          example: FA Cup Quarter Final (Extended)
        channel_id:
          type: string
          example: sports1.example.com
        channel_name:
          type: string
          example: Sports 1 HD

    PreviewSourceDto:
      type: object
      description: Source channel definition for conflict preview.
      required:
        - target_name
        - virtual_id
        - input_name
      properties:
        target_name:
          type: string
          example: main
        virtual_id:
          type: string
          example: "1001"
        input_name:
          type: string
          example: sat-feed-1
        channel_id:
          type:
            - string
            - "null"
          example: sports1.example.com
        channel_name:
          type:
            - string
            - "null"
          example: Sports 1 HD

    PreviewCandidateDto:
      type: object
      description: Candidate time window and priority for conflict preview.
      required:
        - padded_start
        - padded_end
      properties:
        padded_start:
          type: integer
          format: int64
          description: Padded start time in Unix timestamp seconds.
          example: 1740045480
        padded_end:
          type: integer
          format: int64
          description: Padded end time in Unix timestamp seconds.
          example: 1740053100
        pre_roll_secs:
          type: integer
          default: 0
          example: 120
        post_roll_secs:
          type: integer
          default: 0
          example: 300
        priority:
          type: integer
          default: 0
          example: 0

    PreviewConflictsBody:
      type: object
      description: Conflict preview request payload.
      required:
        - source
        - candidate
      properties:
        source:
          $ref: '#/components/schemas/PreviewSourceDto'
        candidate:
          $ref: '#/components/schemas/PreviewCandidateDto'

    OverlapSegmentDto:
      type: object
      description: Segment of time with peak upstream connection demand.
      required:
        - start
        - end
        - peak_demand
      properties:
        start:
          type: integer
          format: int64
          example: 1740045480
        end:
          type: integer
          format: int64
          example: 1740053100
        peak_demand:
          type: integer
          example: 1

    PreviewConflictsResponse:
      type: object
      description: Evaluated conflict analysis result.
      required:
        - severity
      properties:
        severity:
          type: string
          description: Severity classification of potential conflicts (`no_known_conflict`, `possible_capacity_wait`, `likely_missed_window`).
          enum:
            - no_known_conflict
            - possible_capacity_wait
            - likely_missed_window
          example: no_known_conflict
        provider_scope:
          type: string
          description: Upstream provider identifier scoped to the check (omitted when unknown or not applicable).
          example: sat-provider
        overlap_segments:
          type: array
          items:
            $ref: '#/components/schemas/OverlapSegmentDto'

    ErrorResponse:
      type: object
      description: Standard API error envelope.
      required:
        - error
      properties:
        error:
          type: string
          description: Machine-readable error code string.
          example: feature_disabled

    RecordingKind:
      type: string
      enum:
        - live
        - vod
        - series
      description: Media kind of a recording task.
      example: live

    TaskPriorityDto:
      type: string
      enum:
        - background
        - normal
        - high
      description: Scheduling priority tier of a task.
      example: normal

    TransferStatusDto:
      type: string
      enum:
        - scheduled
        - queued
        - waiting_for_capacity
        - retry_waiting
        - running
        - paused
        - cancelling
        - completed
        - failed
        - cancelled
      description: Execution and transfer state of a recording task.
      example: completed

    RecordingAllowedActions:
      type: object
      required:
        - pause
        - resume
        - cancel
        - retry
        - edit
        - remove
      properties:
        pause:
          type: boolean
        resume:
          type: boolean
        cancel:
          type: boolean
        retry:
          type: boolean
        edit:
          type: boolean
        remove:
          type: boolean
      description: Allowed client actions computed from current recording task state.

    RecordingQuotaSummaryDto:
      type: object
      required:
        - private_used_bytes
        - shared_used_bytes
      properties:
        private_used_bytes:
          type: integer
          format: int64
          description: Bytes consumed by caller's private recordings.
          example: 4294967296
        private_limit_bytes:
          type:
            - integer
            - "null"
          format: int64
          description: Resolved private storage quota in bytes (null if unlimited).
          example: 21474836480
        shared_used_bytes:
          type: integer
          format: int64
          description: Bytes consumed by shared recordings.
          example: 0
        shared_limit_bytes:
          type:
            - integer
            - "null"
          format: int64
          description: Resolved shared storage quota in bytes (null if unlimited).
          example: null
      description: Caller's own private and shared recording quota consumption.

    RecordingTaskDto:
      type: object
      required:
        - id
        - title
        - kind
        - priority
        - status
        - retry_attempts
        - transferred_bytes
        - restart_from_beginning_required
        - visibility
        - pre_roll_secs
        - post_roll_secs
        - allowed_actions
      properties:
        id:
          type: string
          description: Unique recording request identifier.
          example: 3f6a1e0c-7d3a-4b5e-9c1e-0a2b6c8d9e10
        title:
          type: string
          description: Display title of the recording.
          example: Morning Match
        kind:
          $ref: '#/components/schemas/RecordingKind'
        priority:
          $ref: '#/components/schemas/TaskPriorityDto'
        status:
          $ref: '#/components/schemas/TransferStatusDto'
        retry_attempts:
          type: integer
          description: Number of execution retry attempts made so far.
          example: 0
        transferred_bytes:
          type: integer
          format: int64
          description: Total bytes transferred to disk.
          example: 4294967296
        total_bytes:
          type: integer
          format: int64
          description: Expected total file size in bytes (omitted when unknown).
        next_retry_at:
          type: integer
          format: int64
          description: Unix timestamp seconds of next retry attempt (omitted when unknown).
        error:
          type: string
          description: Last error message encountered during capture (omitted when unknown).
        restart_from_beginning_required:
          type: boolean
          description: Whether restarting from beginning is required after byte-range failure.
          example: false
        owner_id:
          type: string
          description: Owner identifier (present only for caller's own items, omitted otherwise).
          example: api:alice
        visibility:
          $ref: '#/components/schemas/RecordingVisibility'
        channel_id:
          type: string
          description: EPG channel mapping identifier (omitted when unknown).
          example: sports1.example.com
        channel_name:
          type: string
          description: Channel display name (omitted when unknown).
          example: Sports 1 HD
        program_title:
          type: string
          description: Programme title (omitted when unknown).
          example: Morning Match
        program_start:
          type: integer
          format: int64
          description: Scheduled start time as Unix timestamp seconds (omitted when unknown).
          example: 1763679600
        program_end:
          type: integer
          format: int64
          description: Scheduled end time as Unix timestamp seconds (omitted when unknown).
          example: 1763683200
        scheduled_start:
          type: integer
          format: int64
          description: Padded start time as Unix timestamp seconds (omitted when unknown).
          example: 1763679570
        scheduled_end:
          type: integer
          format: int64
          description: Padded end time as Unix timestamp seconds (omitted when unknown).
          example: 1763683260
        pre_roll_secs:
          type: integer
          format: int64
          description: Pre-roll padding in seconds.
          example: 30
        post_roll_secs:
          type: integer
          format: int64
          description: Post-roll padding in seconds.
          example: 60
        completed_at:
          type: integer
          format: int64
          description: Unix timestamp seconds when recording completed (omitted when unknown).
          example: 1763683300
        filename:
          type: string
          description: Basename of the finished recording file (omitted when unknown).
          example: Morning-Match-2026-11-20.ts
        epg:
          $ref: '#/components/schemas/EpgEpisodeMetadata'
        rule_id:
          type: string
          description: Originating recurring rule identifier (omitted when unknown).
        occurrence_key:
          type: string
          description: Provenance key for recurring occurrences (omitted when unknown).
        allowed_actions:
          $ref: '#/components/schemas/RecordingAllowedActions'
      description: Owner-filtered public projection of a recording task.

    RecordingSnapshotResponse:
      type: object
      required:
        - revision
        - available
        - quota
        - tasks
      properties:
        revision:
          type: integer
          format: int64
          description: Monotonic queue revision counter.
          example: 12
        available:
          type: boolean
          description: Whether the DVR subsystem is operational and accepting tasks.
          example: true
        quota:
          $ref: '#/components/schemas/RecordingQuotaSummaryDto'
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/RecordingTaskDto'
      description: Full recording queue snapshot and quota summary delivered over WebSocket.
