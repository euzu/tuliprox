          schema:
            type: string
          example: 01j7x8a9bcdef0123456789abc
        - name: Range
          in: header
          required: false
          description: HTTP byte range request (e.g. `bytes=0-1048575` or `bytes=1048576-`).
          schema:
            type: string
          example: bytes=0-1048575
      responses:
        '200':
          description: Full media stream.
          headers:
            Content-Type:
              schema:
                type: string
                example: application/octet-stream
            Accept-Ranges:
              schema:
                type: string
                example: bytes
            Content-Length:
              schema:
                type: integer
                example: 524288000
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '206':
          description: Partial media content matching requested byte range.
          headers:
