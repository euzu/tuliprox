  /movie/{username}/{password}/{stream_id}:
    get:
      tags:
        - Playback
      security: []
      operationId: getXtreamMovieStream
      summary: Xtream Codes VOD movie stream playback
      description: |
        Streams VOD movie media in its native container format, or serves completed DVR recordings
        published under synthetic VOD stream IDs (Feature F2).

        **Recordings in Xtream VOD**:
        - Prerequisites: Global DVR enabled (`video.recording.enabled: true`), API proxy user
          (`api_proxy.yml`), recording level `read`, `private`, or `shared`, `video` cluster permitted, and
          target has Xtream output. The `skip_vod` input flag does not hide recordings.
        - Collision precedence: Target playlist items always take precedence. If a playlist item matches
          `stream_id`, it is streamed. Recordings are consulted only when no playlist item matches.
        - ID threshold: Only stream IDs `>= 1000000000` are looked up as recordings.
        - Lookup and fallback behavior: An invisible or unknown recording ID answers like any unknown movie ID
          (the normal fallback response, e.g. `X-Tuliprox-Fallback: channel_unavailable`), NOT a bare 404. If a recording's
          file was removed externally, it remains listed until the queue notices; playback then answers like an unknown movie ID.
        - Completed recordings only: Only completed recordings are served. Scheduled, running, paused, cancelling, failed,
          or cancelled tasks are neither listed nor playable.
        - Visibility rules: Private recordings are served only to their owner. Shared recordings require matching
          target and passing channel content filters. Invisible or foreign recordings answer like an unknown movie ID.
        - HTTP Range requests: Fully supported (`Range: bytes=START-END`, `bytes=START-`, `bytes=-N`), returning
          `206 Partial Content` with `Content-Range`, `Content-Length`, and `Accept-Ranges: bytes`, or
          `416 Range Not Satisfiable`.
        - `Content-Type`: Derived from the container extension (e.g. `video/mp2t` for `.ts`, `video/mp4` for `.mp4`,
          `video/x-matroska` for `.mkv`).
        - Connection accounting & throttling: Counts as one user connection like a library file, occupying one of the user's
          `max_connections` slots for the duration of playback. Recording playback records no provider for the session
          (it plays from local storage) and does not consume an upstream provider connection slot.
          When `max_connections` is exhausted, returns `502 Bad Gateway` (or custom fallback video) with
          `X-Tuliprox-Rejection: admission_rejected` and `X-Tuliprox-Fallback: user_connections_exhausted`.
          When stream throttling is configured (`throttle_kbps`), playback is throttled like library files.
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
          example: alice
        - name: password
          in: path
          required: true
          schema:
            type: string
          example: secretpassword
        - name: stream_id
          in: path
          required: true
          description: Movie or completed recording stream identifier with container extension (e.g. `5001.mp4`, `1000000000.ts`).
          schema:
            type: string
          example: 1000000000.ts
        - name: Range
          in: header
          required: false
          description: Standard RFC 7233 byte-range request (e.g. `bytes=0-1048575`).
          schema:
            type: string
          example: bytes=0-1048575
      responses:
        '200':
          description: Full VOD media or recording stream.
          headers:
            Content-Type:
              schema:
                type: string
                example: video/mp2t
            Accept-Ranges:
              schema:
                type: string
                example: bytes
          content:
            video/mp2t:
              schema:
                type: string
                format: binary
            video/mp4:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        '206':
          description: Partial content response for HTTP Range request on VOD or recording media.
          headers:
            Content-Type:
              schema:
                type: string
                example: video/mp2t
            Content-Range:
              schema:
                type: string
                example: bytes 0-1048575/524288000
            Content-Length:
              schema:
                type: integer
                example: 1048576
            Accept-Ranges:
              schema:
                type: string
                example: bytes
          content:
            video/mp2t:
              schema:
                type: string
                format: binary
            video/mp4:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Stream ID not found or playlist item absent (when fallback response is disabled). Note that invisible or unknown recording IDs answer with the normal fallback response instead of a bare 404.
        '416':
          description: Requested Range Not Satisfiable.
          headers:
            Content-Range:
              schema:
                type: string
                example: bytes */524288000
        '502':
          description: Admission rejected (e.g. user connection limit exhausted) or provider failure.
          headers:
            X-Tuliprox-Fallback:
              $ref: '#/components/headers/X-Tuliprox-Fallback'
            X-Tuliprox-Rejection:
              $ref: '#/components/headers/X-Tuliprox-Rejection'
            Cache-Control:
              schema:
                type: string
                example: no-store

