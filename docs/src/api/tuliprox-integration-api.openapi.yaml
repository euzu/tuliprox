      x-required-feature: recording (private or shared)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreviewConflictsBody'
            example:
              source:
                target_name: main
                virtual_id: "1001"
                input_name: sat-feed-1
                channel_id: sports1.example.com
                channel_name: Sports 1 HD
              candidate:
                padded_start: 1740045480
                padded_end: 1740053100
                pre_roll_secs: 120
                post_roll_secs: 300
                priority: 0
      responses:
        '200':
          description: Conflict preview evaluation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreviewConflictsResponse'
              example:
                severity: no_known_conflict
                provider_scope: sat-provider
                overlap_segments:
                  - start: 1740045480
                    end: 1740053100
                    peak_demand: 1
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          description: Source channel unavailable or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: recording_invalid_source
        '501':
          $ref: '#/components/responses/RecordingDisabledError'

  /api/v1/recording/rules:
    get:
      tags:
        - Recordings
      operationId: listRecordingRules
      summary: List visible recurring recording rules
      description: |
        Lists recurring recording rules visible to the caller: own rules always, shared rules of the own target only
        when the source channel passes the content filter. Every entry carries the queue `revision` observed while
        the list was assembled.

        Playlist users receive the redacted `UserRecordingRuleResponse` shape: `source` omits `provider_id` and
        `input_name`, `own` marks the caller's rules, and `owner_id` is present only for own rules.

        **Requirements**:
        - Requires recording level `read` or higher (`recording.read`). Without it the answer is `403 recording_forbidden`.
        - Requires the DVR to be enabled (`video.recording.enabled: true`), otherwise `501 recording_disabled`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Visible recording rules.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserRecordingRuleResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '501':
          $ref: '#/components/responses/RecordingDisabledError'
    post:
      tags:
        - Recordings
      operationId: createRecordingRule
      summary: Create a recurring weekly recording rule
      description: |
        Creates a `weekly_timeslot` rule for a channel of the caller's own target. The source is resolved by the
        server from `virtual_id`/`channel_id`; a stream URL is never accepted. For playlist users the server also
        derives `input_name` (a client-supplied value is ignored) and stores `target_id` as the resolved target name.
        A `new_episode` body is refused with `400 recording_rule_new_episode_unsupported`.

        **Requirements**:
        - Requires recording level `private` or `shared` (`recording.create` and `recording.manage`).
        - `visibility: shared` additionally requires `recording.share`.
        - The owner's rule count must stay below `player_features.max_recording_rules`, otherwise
          `400 recording_rule_limit_exceeded`.
        - The DVR must be enabled, otherwise `501 recording_disabled`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRecordingRuleRequest'
            example:
              virtual_id: "1042"
              body:
                kind: weekly_timeslot
                weekday: 3
                local_start_time: "20:00"
                duration_secs: 3600
                timezone: Europe/Berlin
              pre_roll_secs: 0
              post_roll_secs: 60
              visibility: private
      responses:
        '200':
          description: Rule created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRecordingRuleResponse'
        '400':
          description: Invalid rule, source, padding, unsupported body, or rule limit reached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidSource:
                  value:
                    error: recording_invalid_source
                limitExceeded:
                  value:
                    error: recording_rule_limit_exceeded
                newEpisodeUnsupported:
                  value:
                    error: recording_rule_new_episode_unsupported
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '501':
          $ref: '#/components/responses/RecordingDisabledError'

  /api/v1/recording/rules/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Stable recording rule id.
        schema:
          type: string
        example: rule-1763678400-ab12cd34
    patch:
      tags:
        - Recordings
      operationId: editRecordingRule
      summary: Edit an own recording rule
      description: |
        Changes the editable fields of a rule. Source, owner, and target are immutable. A `private`-only user cannot
        promote a rule to `shared` (`403 recording_shared_not_administrator`).

        **Requirements**:
        - Requires recording level `private` or `shared`; shared rules additionally require `recording.share`.
        - Only the owner may edit a rule; foreign rules answer `403 recording_rule_not_owner`.
        - The DVR must be enabled, otherwise `501 recording_disabled`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditRecordingRuleRequest'
            example:
              pre_roll_secs: 120
              enabled: false
      responses:
        '200':
          description: Rule updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRecordingRuleResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Rule id does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: recording_rule_unknown
        '501':
          $ref: '#/components/responses/RecordingDisabledError'
    delete:
      tags:
        - Recordings
      operationId: deleteRecordingRule
      summary: Delete an own recording rule
      description: |
        Deletes a rule. `future=retain` keeps already scheduled occurrences; `future=cancel` cancels upcoming
        inactive occurrences before removing the rule. The parameter is required on the REST route; the MCP tool
        `me_delete_rule` defaults it to `retain`.

        **Requirements**:
        - Requires recording level `private` or `shared`; shared rules additionally require `recording.share`.
        - Only the owner may delete a rule; foreign rules answer `403 recording_rule_not_owner`.
        - The DVR must be enabled, otherwise `501 recording_disabled`.
      security:
        - bearerAuth: []
      parameters:
        - name: future
          in: query
          required: true
          description: How to treat already scheduled occurrences.
          schema:
            type: string
            enum:
              - retain
              - cancel
          example: retain
      responses:
        '204':
          description: Rule deleted.
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Rule id does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: recording_rule_unknown
        '500':
          description: Rule store failure, including a partial operation after future recordings were cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                persistenceFailed:
                  value:
                    error: recording_persistence_failed
                partialOperation:
                  value:
                    error: recording_rule_partial_operation
        '501':
          $ref: '#/components/responses/RecordingDisabledError'

