  /api/v1/recording/conflicts/preview:
    post:
      tags:
        - Recordings
      operationId: previewRecordingConflicts
      summary: Preview recording conflicts and capacity demand
      description: |
        Previews potential upstream capacity demand and provider conflicts for a proposed recording time window
        before scheduling.
      security:
